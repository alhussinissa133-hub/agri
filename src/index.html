<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f6b3a">
<title>محاسبة الصيدلية الزراعية</title>
<style>
:root{
  --bg:#f4f6f1; --card:#fff; --ink:#1d2a1f; --mute:#667365; --line:#dde3d8;
  --brand:#2f6b3a; --brand-ink:#fff; --brand-soft:#e4efe4; --warn:#b26a00; --warn-soft:#fff1d6;
  --bad:#b3261e; --bad-soft:#fde4e1; --ok:#1b7a3a; --shadow:0 1px 3px rgba(0,0,0,.08);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#141a15;--card:#1d261f;--ink:#e8efe8;--mute:#9aa99b;--line:#2f3b31;--brand:#5fa86b;--brand-ink:#0d1a10;
    --brand-soft:#243a28;--warn:#e0a33a;--warn-soft:#3a2f15;--bad:#ff8a80;--bad-soft:#3d1f1c;--ok:#6fd08a;--shadow:none}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic","Noto Sans Arabic",Arial,sans-serif;font-size:16px}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-height:44px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--brand);outline-offset:0}
textarea{min-height:70px}
button{cursor:pointer;border:0;border-radius:10px;padding:10px 16px;min-height:44px;background:var(--brand);color:var(--brand-ink);font-weight:600}
button.sec{background:var(--card);color:var(--ink);border:1px solid var(--line)}
button.bad{background:var(--bad);color:#fff}
button.ghost{background:transparent;color:var(--brand);padding:6px 10px;min-height:36px}
button:disabled{opacity:.5;cursor:not-allowed}
button.sm{min-height:36px;padding:6px 12px;font-size:14px}
.hidden{display:none!important}
.num{direction:ltr;unicode-bidi:plaintext;font-variant-numeric:tabular-nums}
.mute{color:var(--mute)} .small{font-size:13px}
.bad-t{color:var(--bad)} .ok-t{color:var(--ok)} .warn-t{color:var(--warn)}
.row{display:flex;gap:10px;align-items:center}.row.wrap{flex-wrap:wrap}.grow{flex:1;min-width:0}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:700px){.g3,.g4{grid-template-columns:repeat(2,1fr)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow)}
.tile .v{font-size:24px;font-weight:700;margin-top:2px}.tile .l{color:var(--mute);font-size:13px}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;background:var(--brand-soft);color:var(--brand)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.bad{background:var(--bad-soft);color:var(--bad)}
label.f{display:block;font-size:13px;color:var(--mute);margin:0 0 4px}
.field{margin-bottom:10px}
h2{margin:0 0 12px;font-size:20px} h3{margin:0 0 8px;font-size:16px}
table{width:100%;border-collapse:collapse}
th,td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:right;vertical-align:middle}
th{font-size:13px;color:var(--mute);font-weight:600;white-space:nowrap}
.scroll{overflow-x:auto}
.list>.item{display:flex;gap:10px;align-items:center;padding:11px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.list>.item:last-child{border-bottom:0}.list>.item:active{background:var(--brand-soft)}

/* layout */
#app{min-height:100vh;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;background:var(--brand);color:var(--brand-ink);display:flex;align-items:center;gap:10px;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top))}
.top .title{font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{background:rgba(255,255,255,.18);border-radius:99px;padding:6px 12px;font-size:14px;cursor:pointer;white-space:nowrap;border:0;color:inherit;min-height:36px}
.chip.stale{background:#b26a00;color:#fff}
.body{display:flex;flex:1;min-height:0}
nav.side{width:210px;background:var(--card);border-left:1px solid var(--line);padding:10px;position:sticky;top:56px;align-self:flex-start;height:calc(100vh - 56px);overflow:auto}
nav.side button{display:flex;gap:10px;width:100%;text-align:right;background:transparent;color:var(--ink);margin-bottom:4px;font-weight:500}
nav.side button.on{background:var(--brand-soft);color:var(--brand);font-weight:700}
main{flex:1;padding:14px;min-width:0;max-width:1200px;margin:0 auto;width:100%}
nav.bottom{display:none}
@media(max-width:820px){
  nav.side{display:none}
  nav.bottom{display:flex;position:fixed;bottom:0;inset-inline:0;background:var(--card);border-top:1px solid var(--line);z-index:20;padding-bottom:env(safe-area-inset-bottom);overflow-x:auto}
  nav.bottom button{flex:1;min-width:64px;background:transparent;color:var(--mute);flex-direction:column;display:flex;align-items:center;gap:2px;padding:6px 4px;font-size:11px;border-radius:0}
  nav.bottom button .ic{font-size:20px;line-height:1}
  nav.bottom button.on{color:var(--brand)}
  main{padding:12px 12px 90px}
}
/* modal & toast */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:700px){.ov{align-items:center}}
.modal{background:var(--card);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px}
@media(min-width:700px){.modal{border-radius:18px}}
.modal.wide{max-width:900px}
.modal h2{display:flex;justify-content:space-between;align-items:center}
.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 18px;border-radius:12px;z-index:99;max-width:90vw;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.toast.err{background:var(--bad);}
/* login */
.login{max-width:380px;margin:8vh auto;padding:20px}
.login h1{text-align:center;margin:0 0 4px;font-size:24px;color:var(--brand)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.pad button{font-size:22px;min-height:56px;background:var(--card);color:var(--ink);border:1px solid var(--line)}
.dots{display:flex;justify-content:center;gap:10px;margin:14px 0;min-height:18px}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--brand)}.dots i.f{background:var(--brand)}
.users{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:12px}
.users button{background:var(--card);color:var(--ink);border:2px solid var(--line)}.users button.on{border-color:var(--brand);color:var(--brand)}
/* POS */
.pos{display:grid;grid-template-columns:1.1fr 1fr;gap:12px;align-items:start}
@media(max-width:900px){.pos{grid-template-columns:1fr}}
.res{max-height:340px;overflow:auto}
.res .item small{color:var(--mute)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{background:var(--card);color:var(--ink);border-radius:0;min-height:38px;padding:6px 14px;font-weight:500}
.seg button.on{background:var(--brand);color:var(--brand-ink)}
.cartline{border-bottom:1px solid var(--line);padding:10px 0}
.cartline input{min-height:40px;padding:6px 8px}
.totals{background:var(--brand-soft);border-radius:12px;padding:12px;margin-top:10px}
.totals .big{font-size:26px;font-weight:800;color:var(--brand)}
.bar{height:10px;background:var(--brand);border-radius:5px;min-width:2px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px}
.tabs button{background:var(--card);color:var(--ink);border:1px solid var(--line);white-space:nowrap}
.tabs button.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.offline{background:var(--warn-soft);color:var(--warn);padding:8px 12px;border-radius:10px;margin-bottom:10px;font-size:14px}
#receipt{display:none}
@media print{
  body *{visibility:hidden} #receipt,#receipt *{visibility:visible}
  #receipt{display:block;position:absolute;inset:0;padding:8mm;color:#000;background:#fff;font-size:13px}
  #receipt table td,#receipt table th{padding:3px 2px;color:#000;border-bottom:1px dashed #999}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="receipt"></div>
<script src="lib/qrcode.js" onerror="this.remove()"></script>
<script src="lib/jsQR.js" onerror="this.remove()"></script>
<script src="seed-data.js"></script>
<script src="engine.js"></script>
<script src="store-idb.js"></script>
<script>
"use strict";
/* ============================== أدوات ============================== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const AR = { "أ": "ا", "إ": "ا", "آ": "ا", "ٱ": "ا", "ة": "ه", "ى": "ي", "ؤ": "و", "ئ": "ي" };
const norm = s => String(s ?? "").replace(/[ً-ٰٟـ]/g, "").replace(/[أإآٱةىؤئ]/g, c => AR[c]).toLowerCase().replace(/\s+/g, " ").trim();
const r2 = x => Math.round((+x + Number.EPSILON) * 100) / 100;
const num = (n, d = 2) => (+n || 0).toLocaleString("en", { maximumFractionDigits: d });
const usd = n => { n = +n || 0; return (n < 0 ? "-" : "") + "$" + Math.abs(n).toLocaleString("en", { minimumFractionDigits: 2, maximumFractionDigits: 2 }); };
const syp = n => num(n, 2) + " ل.س";
const money = (n, cur) => cur === "USD" ? usd(n) : syp(n);
const arDate = s => (s || "").slice(0, 16).replace("T", " ");
const todayStr = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : "u" + Date.now() + Math.random().toString(16).slice(2));
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch { } }
};

const S = { token: null, user: null, rate: null, settings: {}, products: [], customers: [], suppliers: [], view: "dash", cart: null };
const UNIT_PACK = "pack";

function toast(msg, err) {
  $$(".toast").forEach(x => x.remove());
  const t = document.createElement("div"); t.className = "toast" + (err ? " err" : ""); t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), err ? 5000 : 2600);
}

/* ===== المحرك المحلي (يعمل داخل الجهاز بدون سيرفر) ===== */
let ENGINE = null;
const AGRI_HOST = window.agriHost || {};
const IS_NATIVE = !!(window.Capacitor && Capacitor.isNativePlatform && Capacitor.isNativePlatform());
const ENGINE_READY = (async () => {
  ENGINE = await PharmaEngine.create({
    store: new IdbStore(), seed: PHARMA_SEED,
    fetchText: AGRI_HOST.fetchText ? u => AGRI_HOST.fetchText(u) : async u => (await fetch(u)).text(),
    getHosts: AGRI_HOST.lanHosts ? () => AGRI_HOST.lanHosts() : async () => []
  });
  if (AGRI_HOST.onSyncRequest) AGRI_HOST.onSyncRequest(req => ENGINE.handleSyncRequest(req).then(r => ({ ok: true, res: r }), e => ({ ok: false, status: e.status || 500, error: e.message })));
  ENGINE.startAuto(30000);
  const rateTick = () => ENGINE.autoRefreshRate().then(r => { if (r && S.user) { S.rate = r.use ? r : S.rate; try { drawRate(); } catch { } } });
  setTimeout(rateTick, 3000); setInterval(rateTick, 10 * 60000);
  ENGINE.on("change", ev => { if (ev && !ev.local && S.user) { clearTimeout(window.__rf); window.__rf = setTimeout(() => { try { loadBasics().then(() => { drawRate(); if (!$(".ov")) go(S.view); }); } catch { } }, 400); } });
})();
async function api(path, opt = {}) {
  await ENGINE_READY;
  try { return await ENGINE.api(opt.method || "GET", path, opt.body, {}); }
  catch (e) {
    if (e.status === 401 && path !== "login") { doLogout(true); throw new Error("انتهت الجلسة"); }
    throw Object.assign(new Error(e.error || e.message || "خطأ"), { status: e.status || 500 });
  }
}
const NORM = x => PharmaEngine.normDigits(x);
const guard = fn => async (...a) => { try { return await fn(...a); } catch (e) { toast(e.message || "خطأ", true); } };

function modal(title, html, { wide = false, onMount, onClose } = {}) {
  const ov = document.createElement("div"); ov.className = "ov";
  ov.innerHTML = `<div class="modal ${wide ? "wide" : ""}"><h2><span>${title}</span><button class="ghost" data-close>✕</button></h2><div class="mbody">${html}</div></div>`;
  const close = () => { ov.remove(); onClose && onClose(); };
  ov.addEventListener("mousedown", e => { if (e.target === ov) close(); });
  ov.querySelector("[data-close]").onclick = close;
  document.body.appendChild(ov);
  onMount && onMount($(".mbody", ov), close);
  return { el: ov, close };
}
function confirmBox(msg, okText = "تأكيد", danger = false) {
  return new Promise(res => {
    const m = modal("تأكيد", `<p>${esc(msg)}</p><div class="row"><button class="${danger ? "bad" : ""} grow" id="y">${okText}</button><button class="sec grow" id="n">إلغاء</button></div>`, { onClose: () => res(false) });
    $("#y", m.el).onclick = () => { res(true); m.el.remove(); }; $("#n", m.el).onclick = () => { m.close(); };
  });
}

/* ============================== الأسعار ============================== */
const rateUse = () => S.rate?.use || 0;
function priceBase(p, cur, tier) {            // سعر الوحدة الأساسية
  const rate = rateUse(), w = tier === "w";
  let u, s;
  if (p.price_mode === "SYP") { s = (w && p.price_wholesale_syp) ? p.price_wholesale_syp : p.price_syp; u = rate ? s / rate : 0; }
  else { u = (w && p.price_wholesale_usd) ? p.price_wholesale_usd : p.price_usd; s = u * rate; }
  return cur === "USD" ? r2(u) : (S.settings.round_syp === "1" ? Math.round(s) : r2(s));
}
function priceFor(p, cur, tier, unit) {
  const b = priceBase(p, cur, tier);
  if (unit === UNIT_PACK && p.pack_unit) { const v = b * (p.pack_factor || 1); return cur === "USD" ? r2(v) : (S.settings.round_syp === "1" ? Math.round(v) : r2(v)); }
  return b;
}
function stockText(p) {
  const st = p.stock || 0;
  if (p.pack_unit && p.pack_factor > 1 && st >= p.pack_factor) {
    const packs = Math.floor(st / p.pack_factor + 1e-9), rem = r2(st - packs * p.pack_factor);
    return `${num(packs)} ${p.pack_unit.split(" ")[0]}` + (rem ? ` + ${num(rem)} ${p.unit}` : "");
  }
  return `${num(st, 3)} ${p.unit}`;
}

/* ============================== تحميل البيانات ============================== */
async function loadBasics() {
  const [rate, settings] = await Promise.all([api("rate"), api("settings")]);
  S.rate = rate && rate.use ? rate : null; S.settings = settings;
}
async function loadProducts() { S.products = await api("products"); }
async function loadCustomers() { S.customers = await api("customers"); }
async function loadSuppliers() { S.suppliers = await api("suppliers"); }

/* ============================== الدخول ============================== */
async function showLogin() {
  S.token = null; S.user = null;
  let info = { shop: "", users: [] };
  try { info = await api("public/users"); } catch { $("#app").innerHTML = `<div class="login card"><h1>تعذّر فتح قاعدة البيانات</h1><p class="mute">أعد تشغيل التطبيق.</p><button onclick="location.reload()">إعادة المحاولة</button></div>`; return; }
  let sel = store.get("last_user", info.users[0]?.id), pin = "";
  const draw = () => {
    $("#app").innerHTML = `<div class="login card">
      <h1>${esc(info.shop || "الصيدلية الزراعية")}</h1><div class="mute" style="text-align:center">تسجيل الدخول</div>
      <div class="users">${info.users.map(u => `<button data-u="${u.id}" class="${u.id == sel ? "on" : ""}">${esc(u.name)}</button>`).join("")}</div>
      <div class="dots">${Array.from({ length: Math.max(6, pin.length) }, (_, i) => i).map(i => `<i class="${i < pin.length ? "f" : ""}"></i>`).join("")}</div>
      <div class="pad">${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(n => `<button data-k="${n}">${n}</button>`).join("")}<button data-k="x">⌫</button><button data-k="0">0</button><button data-k="ok" style="background:var(--brand);color:var(--brand-ink)">دخول</button></div><div style="text-align:center;margin-top:10px"><button class="ghost" id="forgot">نسيت الرمز؟</button></div></div>`;
    $$("[data-u]").forEach(b => b.onclick = () => { sel = b.dataset.u; pin = ""; draw(); });
    $$("[data-k]").forEach(b => b.onclick = () => key(b.dataset.k));
    $("#forgot").onclick = () => recoverModal(sel, info.users.find(u => u.id == sel));
  };
  const submit = guard(async () => {
    if (!sel || pin.length < 4) return;
    try {
      const r = await api("login", { method: "POST", body: { user_id: sel, pin } });
      S.token = r.token; store.set("last_user", sel); await boot();
    } catch (e) { pin = ""; draw(); throw e; }
  });
  const key = k => { if (k === "x") pin = pin.slice(0, -1); else if (k === "ok") return submit(); else if (pin.length < 12 && /^[0-9]$/.test(k)) pin += k; draw(); };
  draw();
  window.onkeydown = e => { if (!$(".login")) return; const dk = NORM(e.key); if (/^[0-9]$/.test(dk)) key(dk); else if (e.key === "Backspace") key("x"); else if (e.key === "Enter") key("ok"); };
}
async function doLogout(silent) {
  if (!silent) { try { await api("logout", { method: "POST" }); } catch { } }
  window.onkeydown = null; await showLogin();
}

async function boot() {
  try { S.user = await api("me"); } catch { return showLogin(); }
  await loadBasics();
  if (S.user.must_change) { shell(); return forceChangePin(); }
  shell(); go(S.view === "login" ? "dash" : S.view);
  startRatePolling();
}
function forceChangePin() {
  modal("غيّر الرمز السري", `<p class="mute">لأمان بياناتك، اختر رمزاً جديداً بدل الرمز الافتراضي (1234).</p>
    <div class="field"><label class="f">الرمز الحالي</label><input id="o" type="password" inputmode="numeric" class="num"></div>
    <div class="field"><label class="f">الرمز الجديد (4 إلى 12 رقماً)</label><input id="n" type="password" inputmode="numeric" class="num"></div>
    <button id="s" style="width:100%">حفظ</button>`, {
    onMount: (b, close) => { $("#s", b).onclick = guard(async () => {
      const np = $("#n", b).value;
      await api("me/pin", { method: "POST", body: { old_pin: $("#o", b).value, new_pin: np } });
      S.user.must_change = 0; toast("تم تغيير الرمز"); close();
      if (S.user.role === "owner") { const r = await api("me/recovery", { method: "POST", body: { pin: np } }); S.user.has_recovery = true; showRecoveryCode(r.recovery_code); }
    }); }
  });
}

/* ============================== الهيكل ============================== */
const NAV = [
  ["dash", "الرئيسية", "🏠", 1], ["pos", "بيع جديد", "🧾", 1], ["sales", "الفواتير", "📋", 1],
  ["products", "الأصناف", "🌱", 1], ["customers", "الزبائن", "👨‍🌾", 1], ["purchases", "مشتريات", "📦", 0],
  ["suppliers", "الموردون", "🚚", 0], ["reports", "التقارير", "📊", 0], ["settings", "الإعدادات", "⚙️", 0]
];
function shell() {
  const items = NAV.filter(n => n[3] || S.user.role === "owner");
  $("#app").innerHTML = `
  <div class="top"><div class="title">${esc(S.settings.shop_name || "الصيدلية الزراعية")}</div>
    <button class="chip" id="rateChip"></button>
    <button class="chip" id="userChip">${esc(S.user.name)} ⏻</button></div>
  <div class="body">
    <nav class="side">${items.map(n => `<button data-v="${n[0]}"><span>${n[2]}</span><span>${n[1]}</span></button>`).join("")}</nav>
    <main id="main"></main></div>
  <nav class="bottom">${items.map(n => `<button data-v="${n[0]}"><span class="ic">${n[2]}</span><span>${n[1]}</span></button>`).join("")}</nav>`;
  $$("[data-v]").forEach(b => b.onclick = () => go(b.dataset.v));
  $("#userChip").onclick = async () => { if (await confirmBox("تسجيل الخروج؟", "خروج")) doLogout(); };
  $("#rateChip").onclick = () => rateModal();
  drawRate();
}
function drawRate() {
  const c = $("#rateChip"); if (!c) return;
  if (!S.rate) { c.textContent = "⚠ أدخل سعر الصرف"; c.classList.add("stale"); return; }
  const ageH = (Date.now() - new Date(S.rate.ts.replace(" ", "T")).getTime()) / 36e5;
  c.textContent = `$1 = ${num(S.rate.use)} ل.س`;
  c.classList.toggle("stale", ageH > 24);
  c.title = `آخر تحديث: ${S.rate.ts} (${S.rate.source})`;
}
let rateTimer;
function startRatePolling() {
  clearInterval(rateTimer);
  rateTimer = setInterval(async () => { try { S.rate = (await api("rate")).use ? await api("rate") : S.rate; drawRate(); } catch { } }, 120000);
}
function go(v) {
  S.view = v;
  $$("[data-v]").forEach(b => b.classList.toggle("on", b.dataset.v === v));
  const fn = VIEWS[v]; if (!fn) return;
  // لكل شاشة حاوية جديدة: أي رسم متأخر لشاشة سابقة يكتب في حاوية منفصلة عن الصفحة فلا يفسد الشاشة الحالية
  const el = document.createElement("div");
  el.innerHTML = `<div class="mute">جارٍ التحميل…</div>`;
  $("#main").replaceChildren(el);
  fn(el).catch(e => { el.innerHTML = `<div class="card bad-t">${esc(e.message)}</div>`; });
  window.scrollTo(0, 0);
}

function newCart() { return { cur: "SYP", tier: "r", items: [], customer_id: null, discount: "", paid: null, note: "" }; }
function pendingQueue() { return []; }

VIEWS.pos = async main => {
  if (!S.cart) S.cart = newCart();
  await Promise.all([loadProducts(), loadCustomers()]);
  const cart = S.cart;
  main.innerHTML = `
  <div id="offbar"></div>
  <div class="pos">
    <div class="card"><h3>الأصناف</h3>
      <input id="q" placeholder="ابحث بالاسم أو المادة الفعالة أو الباركود…" autocomplete="off">
      <div class="res list" id="res" style="margin-top:8px"></div></div>
    <div class="card"><div class="row wrap" style="margin-bottom:8px">
        <div class="seg" id="curSeg"><button data-c="SYP">ليرة</button><button data-c="USD">دولار</button></div>
        <div class="seg" id="tierSeg"><button data-t="r">مفرق</button><button data-t="w">جملة</button></div>
        <div class="grow"></div><button class="ghost" id="clr">تفريغ</button></div>
      <div id="cart"></div><div id="totals"></div></div>
  </div>`;
  const draw = () => { drawSeg(); drawCart(); drawRes(); };
  const drawSeg = () => {
    $$("#curSeg button", main).forEach(b => b.classList.toggle("on", b.dataset.c === cart.cur));
    $$("#tierSeg button", main).forEach(b => b.classList.toggle("on", b.dataset.t === cart.tier));
  };
  const reprice = () => cart.items.forEach(i => i.price = priceFor(i.p, cart.cur, cart.tier, i.unit));
  $$("#curSeg button", main).forEach(b => b.onclick = () => {
    if (b.dataset.c === cart.cur) return;
    if (cart.paid !== null) { const t = total(); cart.paid = null; }
    cart.cur = b.dataset.c; reprice(); draw();
  });
  $$("#tierSeg button", main).forEach(b => b.onclick = () => { cart.tier = b.dataset.t; reprice(); draw(); });
  $("#clr", main).onclick = () => { S.cart = newCart(); VIEWS.pos(main); };

  const sub = () => r2(cart.items.reduce((a, i) => a + i.qty * i.price, 0));
  const total = () => Math.max(0, r2(sub() - (+cart.discount || 0)));
  function drawRes() {
    const q = norm($("#q", main).value), box = $("#res", main);
    let list = S.products;
    if (q) { const parts = q.split(" "); list = list.filter(p => { const h = norm(p.name + " " + (p.active_ingredient || "") + " " + (p.company || "") + " " + (p.category || "") + " " + (p.barcode || "") + " " + (p.code || "")); return parts.every(w => h.includes(w)); }); }
    list = list.slice(0, 40);
    box.innerHTML = list.map(p => {
      const pr = priceFor(p, cart.cur, cart.tier, "base");
      return `<div class="item" data-id="${p.id}"><div class="grow"><b>${esc(p.name)}</b><br><small>${esc(p.category || "")}${p.company ? " · " + esc(p.company) : ""} · المخزون: ${stockText(p)}</small></div>
        <div class="num" style="font-weight:700">${pr ? money(pr, cart.cur) : '<span class="warn-t small">بلا سعر</span>'}<br><small class="mute">/${esc(p.unit)}</small></div></div>`;
    }).join("") || `<div class="mute" style="padding:12px">لا نتائج</div>`;
    $$(".item", box).forEach(e => e.onclick = () => add(e.dataset.id));
  }
  function add(id, unit) {
    const p = S.products.find(x => x.id === id); if (!p) return;
    const ex = cart.items.find(i => i.p.id === id && i.unit === (unit || "base"));
    if (ex) ex.qty += 1; else cart.items.push({ p, unit: unit || "base", qty: 1, price: priceFor(p, cart.cur, cart.tier, unit || "base") });
    cart.paid = cart.paid; drawCart();
  }
  $("#q", main).oninput = drawRes;
  $("#q", main).onkeydown = e => {
    if (e.key !== "Enter") return; const v = e.target.value.trim(); if (!v) return;
    const exact = S.products.find(p => p.barcode === v || p.code === v);
    if (exact) { add(exact.id); e.target.value = ""; drawRes(); }
    else { const first = $("#res .item", main); if (first && $$("#res .item", main).length === 1) { first.click(); e.target.value = ""; drawRes(); } }
  };

  function drawCart() {
    const box = $("#cart", main);
    if (!cart.items.length) { box.innerHTML = `<div class="mute" style="padding:18px;text-align:center">اختر أصنافاً من القائمة</div>`; $("#totals", main).innerHTML = ""; return; }
    box.innerHTML = cart.items.map((i, idx) => `
      <div class="cartline" data-i="${idx}">
        <div class="row"><b class="grow">${esc(i.p.name)}</b><button class="ghost bad-t" data-del>✕</button></div>
        <div class="row wrap" style="margin-top:6px">
          <div style="width:96px"><label class="f">الكمية</label><input class="num" data-qty inputmode="decimal" value="${i.qty}"></div>
          ${i.p.pack_unit ? `<div style="width:130px"><label class="f">الوحدة</label><select data-unit><option value="base" ${i.unit === "base" ? "selected" : ""}>${esc(i.p.unit)}</option><option value="pack" ${i.unit === "pack" ? "selected" : ""}>${esc(i.p.pack_unit)}</option></select></div>` : `<div class="mute small" style="width:60px;padding-top:18px">${esc(i.p.unit)}</div>`}
          <div class="grow"><label class="f">السعر (${cart.cur === "USD" ? "$" : "ل.س"})</label><input class="num" data-price inputmode="decimal" value="${i.price}"></div>
          <div style="min-width:90px;text-align:left" class="num"><label class="f">المجموع</label><b>${money(r2(i.qty * i.price), cart.cur)}</b></div>
        </div></div>`).join("");
    $$(".cartline", box).forEach(el => {
      const i = cart.items[+el.dataset.i];
      $("[data-del]", el).onclick = () => { cart.items.splice(+el.dataset.i, 1); drawCart(); };
      $("[data-qty]", el).oninput = e => { i.qty = Math.max(0, +e.target.value || 0); drawTotals(); $(".num b", el).textContent = money(r2(i.qty * i.price), cart.cur); };
      $("[data-price]", el).oninput = e => { i.price = Math.max(0, +e.target.value || 0); drawTotals(); $(".num b", el).textContent = money(r2(i.qty * i.price), cart.cur); };
      const u = $("[data-unit]", el); if (u) u.onchange = e => { i.unit = e.target.value; i.price = priceFor(i.p, cart.cur, cart.tier, i.unit); drawCart(); };
    });
    drawTotals(true);
  }
  function drawTotals(rebuild) {
    const t = total(), paid = cart.paid === null ? t : Math.min(+cart.paid || 0, t), rem = r2(t - paid);
    const box = $("#totals", main);
    if (rebuild || !$("#paid", box)) {
      box.innerHTML = `
      <div class="grid g2" style="margin-top:10px">
        <div class="field"><label class="f">الزبون ${rem > 0 ? '<span class="bad-t">(مطلوب للدين)</span>' : ""}</label>
          <select id="cust"><option value="">— زبون نقدي —</option>${S.customers.map(c => `<option value="${c.id}" ${c.id == cart.customer_id ? "selected" : ""}>${esc(c.name)}${c.village ? " - " + esc(c.village) : ""}${c.balance_usd > 0.01 ? "  (عليه " + usd(c.balance_usd) + ")" : ""}</option>`).join("")}</select>
          <button class="ghost" id="newc">+ زبون جديد</button></div>
        <div class="field"><label class="f">خصم</label><input id="disc" class="num" inputmode="decimal" value="${cart.discount}"></div>
      </div>
      <div class="totals">
        <div class="row"><span class="grow">المجموع</span><span class="num big" id="tot"></span></div>
        <div class="row" style="margin-top:6px"><span class="grow" id="eq" class="mute small"></span></div>
        <div class="row" style="margin-top:8px"><div class="grow"><label class="f">المدفوع الآن</label><input id="paid" class="num" inputmode="decimal"></div>
          <button class="sec sm" id="full" style="margin-top:18px">كامل</button><button class="sec sm" id="debt" style="margin-top:18px">دين</button></div>
        <div id="remline" style="margin-top:6px"></div>
      </div>
      <div class="field" style="margin-top:8px"><input id="note" placeholder="ملاحظة (اختياري)" value="${esc(cart.note)}"></div>
      <button id="save" style="width:100%;font-size:18px;min-height:52px">حفظ الفاتورة</button>`;
      $("#cust", box).onchange = e => { cart.customer_id = e.target.value || null; drawTotals(); };
      $("#newc", box).onclick = () => customerForm(null, async id => { await loadCustomers(); cart.customer_id = id; drawTotals(true); });
      $("#disc", box).oninput = e => { cart.discount = e.target.value; cart.paid = cart.paid; drawTotals(); };
      $("#paid", box).oninput = e => { cart.paid = e.target.value === "" ? null : (+e.target.value || 0); drawTotals(); };
      $("#full", box).onclick = () => { cart.paid = null; $("#paid", box).value = total(); drawTotals(); };
      $("#debt", box).onclick = () => { cart.paid = 0; $("#paid", box).value = 0; drawTotals(); };
      $("#note", box).oninput = e => cart.note = e.target.value;
      $("#save", box).onclick = save;
      $("#paid", box).value = paid;
    }
    $("#tot", box).textContent = money(t, cart.cur);
    $("#eq", box).textContent = S.rate ? "≈ " + (cart.cur === "USD" ? syp(Math.round(t * rateUse())) : usd(t / rateUse())) : "";
    $("#eq", box).className = "mute small grow";
    $("#remline", box).innerHTML = rem > 0.004 ? `<span class="bad-t">المتبقي دين: <b class="num">${money(rem, cart.cur)}</b></span>` : `<span class="ok-t">مدفوعة بالكامل</span>`;
  }

  const save = guard(async () => {
    if (!cart.items.length) return toast("الفاتورة فارغة", true);
    if (!S.rate) return toast("أدخل سعر الصرف أولاً", true);
    if (cart.items.some(i => !(i.qty > 0))) return toast("هناك صنف بكمية صفر", true);
    if (cart.items.some(i => !(i.price > 0)) && !(await confirmBox("يوجد صنف بسعر صفر، هل تريد المتابعة؟"))) return;
    const t = total(), paid = cart.paid === null ? t : Math.min(+cart.paid || 0, t);
    if (t - paid > 0.004 && !cart.customer_id) return toast("اختر زبوناً لتسجيل الدين", true);
    const body = {
      uuid: uuid(), ts: new Date(Date.now() - new Date().getTimezoneOffset() * 6e4).toISOString().slice(0, 19).replace("T", " "),
      currency: cart.cur, rate: rateUse(), customer_id: cart.customer_id, discount: +cart.discount || 0, paid, note: cart.note,
      items: cart.items.map(i => ({ product_id: i.p.id, qty: i.qty, unit: i.unit, price: i.price }))
    };
    $("#save", main).disabled = true;
    try {
      const r = await api("sales", { method: "POST", body });
      if (r.over_credit_limit) toast("تنبيه: الزبون تجاوز حد الدين المسموح", true);
      S.cart = newCart(); showReceipt(r); VIEWS.pos(main);
    } catch (e) {
      throw e;
    } finally { const b = $("#save", main); if (b) b.disabled = false; }
  });
  const q = pendingQueue().length;
  $("#offbar", main).innerHTML = q ? `<div class="offline">⚠ ${q} فاتورة بانتظار الإرسال للسيرفر (ستُرسل تلقائياً)</div>` : "";
  draw();
};
async function flushPending() { return; /* لم يعد لازماً: الحفظ محلي دائماً */
  const q = pendingQueue(); if (!q.length || !S.token) return;
  const rest = [];
  for (const b of q) {
    try { await api("sales", { method: "POST", body: b }); }
    catch (e) { if (!e.status) rest.push(b); else { toast("فاتورة محفوظة محلياً رُفضت: " + e.message, true); rest.push({ ...b, _err: e.message }); } }
  }
  store.set("pending_sales", rest.filter(x => !x._err));
  if (q.length !== rest.length) toast("تم إرسال " + (q.length - rest.length) + " فاتورة محفوظة");
}
setInterval(flushPending, 20000); window.addEventListener("online", flushPending);

function receiptHTML(s) {
  return `<div style="text-align:center"><b style="font-size:16px">${esc(S.settings.shop_name)}</b><br>فاتورة ${esc(s.number)} — ${esc(arDate(s.ts))}${s.customer_name ? "<br>الزبون: " + esc(s.customer_name) : ""}</div>
  <table style="margin-top:6px"><tr><th>الصنف</th><th>الكمية</th><th>السعر</th><th>المجموع</th></tr>
  ${s.items.map(i => `<tr><td>${esc(i.name)}</td><td class="num">${num(i.qty_unit, 3)} ${esc(i.sold_unit === "pack" ? i.pack_unit : i.unit)}</td><td class="num">${num(i.price)}</td><td class="num">${num(i.line_total)}</td></tr>`).join("")}</table>
  <hr>${s.discount ? `<div>خصم: <span class="num">${money(s.discount, s.currency)}</span></div>` : ""}
  <div><b>الإجمالي: <span class="num">${money(s.total, s.currency)}</span></b></div>

function showReceipt(s) {

    <div class="row" style="margin-top:12px"><button class="grow" id="pr">🖨 طباعة</button><button class="sec grow" id="ok">إغلاق</button></div>`, {

function printSale(s) { $("#receipt").innerHTML = receiptHTML(s); window.print(); }

/* ============================== الفواتير ============================== */
VIEWS.sales = async main => {
  let from = todayStr(), to = todayStr();
  const load = async () => {
    const rows = await api(`sales?from=${from}&to=${to}`);
    $("#list", main).innerHTML = rows.map(s => `<div class="item" data-id="${s.id}"><div class="grow"><b>${esc(s.number)}</b> ${s.voided ? '<span class="pill bad">ملغاة</span>' : ""}<br><small class="mute">${esc(arDate(s.ts))} · ${esc(s.customer_name || "نقدي")}</small></div>
      <div class="num" style="text-align:left"><b>${money(s.total, s.currency)}</b>${s.total - s.paid > 0.004 ? `<br><small class="bad-t">دين ${money(s.total - s.paid, s.currency)}</small>` : ""}</div></div>`).join("") || `<div class="mute" style="padding:12px">لا فواتير</div>`;
    $$(".item", main).forEach(e => e.onclick = guard(async () => saleModal(await api("sales/" + e.dataset.id), load)));
  };
  main.innerHTML = `<h2>الفواتير</h2><div class="card"><div class="row wrap"><div class="grow"><label class="f">من</label><input type="date" id="f" value="${from}"></div><div class="grow"><label class="f">إلى</label><input type="date" id="t" value="${to}"></div></div><div class="list" id="list" style="margin-top:8px"></div></div>`;
  $("#f", main).onchange = e => { from = e.target.value; load(); }; $("#t", main).onchange = e => { to = e.target.value; load(); };
  await load();
};
function saleModal(s, reload) {
  modal("فاتورة " + s.number, `<div class="card">${receiptHTML(s)}</div>
  <div class="row" style="margin-top:12px"><button class="grow" id="pr">🖨 طباعة</button>
  ${S.user.role === "owner" && !s.voided ? `<button class="bad grow" id="vd">إلغاء الفاتورة</button>` : ""}</div>`, {
    onMount: (b, close) => {

  };
}

  const segDraw = () => $$("#cs button", main).forEach(b => b.classList.toggle("on", b.dataset.c === P.cur));
  $$("#cs button", main).forEach(b => b.onclick = () => { P.cur = b.dataset.c; segDraw(); drawItems(); });
  $("#addi", main).onclick = () => pickProduct(p => { P.items.push({ p, qty: 1, unit: p.pack_unit ? "pack" : "base", cost: 0, expiry: "", batch_no: "" }); drawItems(); });
  const total = () => Math.max(0, r2(P.items.reduce((a, i) => a + i.qty * i.cost, 0) - (+P.discount || 0)));
  function drawItems() {
    $("#items", main).innerHTML = P.items.map((i, idx) => `<div class="cartline" data-i="${idx}"><div class="row"><b class="grow">${esc(i.p.name)}</b><button class="ghost bad-t" data-del>✕</button></div>
      <div class="row wrap" style="margin-top:6px"><div style="width:90px"><label class="f">الكمية</label><input class="num" data-k="qty" inputmode="decimal" value="${i.qty}"></div>
      ${i.p.pack_unit ? `<div style="width:130px"><label class="f">الوحدة</label><select data-k="unit"><option value="base" ${i.unit === "base" ? "selected" : ""}>${esc(i.p.unit)}</option><option value="pack" ${i.unit === "pack" ? "selected" : ""}>${esc(i.p.pack_unit)}</option></select></div>` : ""}
      <div style="width:120px"><label class="f">التكلفة (${P.cur === "USD" ? "$" : "ل.س"}) للوحدة</label><input class="num" data-k="cost" inputmode="decimal" value="${i.cost || ""}"></div>
      <div style="width:150px"><label class="f">تاريخ الصلاحية</label><input type="date" data-k="expiry" value="${esc(i.expiry)}"></div>
      <div style="width:110px"><label class="f">رقم الدفعة</label><input data-k="batch_no" value="${esc(i.batch_no)}"></div></div></div>`).join("");
    $$(".cartline", main).forEach(el => { const i = P.items[+el.dataset.i]; $("[data-del]", el).onclick = () => { P.items.splice(+el.dataset.i, 1); drawItems(); };
      $$("[data-k]", el).forEach(inp => { inp.oninput = inp.onchange = e => { const k = inp.dataset.k; i[k] = (k === "qty" || k === "cost") ? (+e.target.value || 0) : e.target.value; drawTotals(); }; }); });
    drawTotals(true);
  }
  function drawTotals(rebuild) {
    const t = total(), paid = P.paid === null ? t : Math.min(+P.paid || 0, t), rem = r2(t - paid), box = $("#pt", main);
    if (rebuild || !$("#ppaid", box)) {
      box.innerHTML = `<div class="grid g2"><div class="field"><label class="f">خصم</label><input id="pd" class="num" inputmode="decimal" value="${P.discount}"></div>
      <div class="field"><label class="f">المدفوع الآن</label><input id="ppaid" class="num" inputmode="decimal"></div></div>
      <div class="row"><span class="grow">الإجمالي</span><b class="num big" id="ptot"></b></div><div id="prem"></div>
      <button id="psave" style="width:100%;margin-top:10px;min-height:50px">حفظ فاتورة الشراء وإدخال المخزون</button>`;
      $("#pd", box).oninput = e => { P.discount = e.target.value; drawTotals(); };
      $("#ppaid", box).oninput = e => { P.paid = e.target.value === "" ? null : (+e.target.value || 0); drawTotals(); }; $("#ppaid", box).value = paid;
      $("#psave", box).onclick = guard(async () => {
        if (!P.items.length) return toast("أضف أصنافاً", true);
        if (P.items.some(i => !(i.cost > 0)) && !(await confirmBox("يوجد صنف بتكلفة صفر، متابعة؟"))) return;
        const tt = total(), pd = P.paid === null ? tt : Math.min(+P.paid || 0, tt);
        await api("purchases", { method: "POST", body: { supplier_id: P.supplier_id, currency: P.cur, invoice_no: P.invoice_no, discount: +P.discount || 0, paid: pd, rate: rateUse(), items: P.items.map(i => ({ product_id: i.p.id, qty: i.qty, unit: i.unit, cost: i.cost, expiry: i.expiry, batch_no: i.batch_no })) } });
        S.purch = null; toast("تم إدخال البضاعة للمخزون"); VIEWS.purchases(main);
      });
    }
    $("#ptot", box).textContent = money(t, P.cur);
    $("#prem", box).innerHTML = rem > 0.004 ? `<span class="bad-t">يبقى دين للمورد: <b class="num">${money(rem, P.cur)}</b></span>` : `<span class="ok-t">مدفوعة بالكامل</span>`;
  }
  segDraw(); drawItems();
};
function pickProduct(cb) {
  modal("اختر صنفاً", `<input id="q" placeholder="ابحث…" autocomplete="off"><div class="res list" id="r" style="margin-top:8px;max-height:55vh"></div>`, {
    onMount: (b, close) => {
      const draw = () => { const w = norm($("#q", b).value).split(" ").filter(Boolean); const l = S.products.filter(p => w.every(x => norm(p.name + " " + (p.active_ingredient || "") + " " + (p.company || "")).includes(x))).slice(0, 40);
        $("#r", b).innerHTML = l.map(p => `<div class="item" data-id="${p.id}"><div class="grow"><b>${esc(p.name)}</b><br><small class="mute">${esc(p.category || "")} · المخزون ${stockText(p)}</small></div></div>`).join("");
        $$(".item", b).forEach(e => e.onclick = () => { cb(S.products.find(p => p.id == e.dataset.id)); close(); }); };
      $("#q", b).oninput = draw; draw(); $("#q", b).focus();
    }
  });
}

   <div class="row wrap" style="margin-top:8px"><button class="sec" id="rs">⬆ استرجاع نسخة</button></div><p class="small mute">البيانات محفوظة على هذا الجهاز. احتفظ بنسخة احتياطية خارج الجهاز بين فترة وأخرى (وربط جهاز ثانٍ نسخة احتياطية تلقائية أيضاً).</p></div>`;
  $("#rt", main).onclick = rateModal;
  $("#svs", main).onclick = guard(async () => { S.settings = await api("settings", { method: "POST", body: { rate_basis: $("#basis", main).value, auto_rate: $("#auto", main).value, rate_interval_min: $("#int", main).value, round_syp: $("#rnd", main).value, shop_name: $("#shop", main).value, expiry_warn_days: $("#exd", main).value, allow_negative_stock: $("#neg", main).value } }); S.rate = await api("rate"); drawRate(); toast("تم الحفظ"); });
  $("#bp", main).onclick = guard(async () => { const p = +$("#pct", main).value; if (!p) return; if (await confirmBox(`تغيير كل أسعار الدولار بنسبة ${p}% ؟`)) { await api("products/bulk_prices", { method: "POST", body: { percent: p } }); toast("تم"); } });
  $("#nu", main).onclick = () => userForm(null);
  $("#rc", main).onclick = () => modal("رمز استعادة جديد", `<p class="small mute">أدخل رمزك الحالي للتأكيد.</p><div class="field"><input id="p" type="password" inputmode="numeric" class="num"></div><button id="s" style="width:100%">إنشاء</button>`, { onMount: (b, c) => { $("#s", b).onclick = guard(async () => { const r = await api("me/recovery", { method: "POST", body: { pin: $("#p", b).value } }); S.user.has_recovery = true; c(); showRecoveryCode(r.recovery_code); }); } });
  $$(".item[data-id]", main).forEach(e => e.onclick = () => userForm(users.find(u => u.id == e.dataset.id)));
  $("#cp", main).onclick = () => modal("تغيير الرمز", `<div class="field"><label class="f">الحالي</label><input id="o" type="password" inputmode="numeric" class="num"></div><div class="field"><label class="f">الجديد</label><input id="n" type="password" inputmode="numeric" class="num"></div><button id="s" style="width:100%">حفظ</button>`, { onMount: (b, c) => { $("#s", b).onclick = guard(async () => { await api("me/pin", { method: "POST", body: { old_pin: $("#o", b).value, new_pin: $("#n", b).value } }); toast("تم"); c(); }); } });
  $("#bk", main).onclick = guard(async () => { const d = await api("backup"), bl = new Blob([JSON.stringify(d)], { type: "application/json" }), a = document.createElement("a"); a.href = URL.createObjectURL(bl); a.download = `pharmacy-${todayStr()}.json`; document.body.appendChild(a); a.click(); a.remove(); toast("تم إنشاء ملف النسخة"); });
  $("#rs", main).onclick = () => { const f = document.createElement("input"); f.type = "file"; f.accept = ".json,application/json"; f.onchange = guard(async () => { const t = await f.files[0].text(); let j; try { j = JSON.parse(t); } catch { throw new Error("ملف غير صالح"); } if (!(await confirmBox("سيتم دمج بيانات الملف مع بيانات هذا الجهاز. متابعة؟"))) return; const r = await api("backup/restore", { method: "POST", body: j }); toast("تمت إضافة " + r.added + " عملية"); go("settings"); }); f.click(); };
  bindSync(main, info); bindUpdates(main);
};
function userForm(u) {
  modal(u ? "تعديل: " + esc(u.name) : "مستخدم جديد", `${u ? "" : `<div class="field"><label class="f">الاسم</label><input id="n"></div>`}
   <div class="field"><label class="f">${u ? "رمز جديد (اتركه فارغاً بلا تغيير)" : "الرمز (أرقام 4-12)"}</label><input id="p" class="num" inputmode="numeric"></div>
   <div class="field"><label class="f">الدور</label><select id="r"><option value="cashier" ${u?.role === "cashier" ? "selected" : ""}>كاشير (بيع وزبائن فقط)</option><option value="owner" ${u?.role === "owner" ? "selected" : ""}>مدير (كل الصلاحيات)</option></select></div>
   ${u ? `<div class="field"><label class="f">الحالة</label><select id="a"><option value="1" ${u.active ? "selected" : ""}>فعّال</option><option value="0" ${u.active ? "" : "selected"}>معطّل</option></select></div>` : ""}<button id="s" style="width:100%">حفظ</button>`, {
    onMount: (b, close) => {
      $("#s", b).onclick = guard(async () => {
        if (u) await api("users/" + u.id, { method: "PUT", body: { pin: $("#p", b).value || undefined, role: $("#r", b).value, active: +$("#a", b).value } });
        else await api("users", { method: "POST", body: { name: $("#n", b).value, pin: $("#p", b).value, role: $("#r", b).value } });
        toast("تم"); close(); go("settings");
      });
    }
  });
}

/* ============================== استعادة الرمز ============================== */
function showRecoveryCode(code) {
  modal("رمز استعادة الحساب", `<p>احتفظ بهذا الرمز بمكان آمن (اكتبه على ورقة). <b>يظهر مرة واحدة فقط</b>، وبه تستطيع إعادة ضبط رمز الدخول إن نسيته.</p>
   <div class="card num" style="font-size:24px;text-align:center;letter-spacing:2px;font-weight:800;margin:10px 0">${esc(code)}</div>
   <div class="row"><button class="sec grow" id="pr">🖨 طباعة</button><button class="sec grow" id="cp">نسخ</button></div>
   <label class="row small" style="margin:12px 0"><input type="checkbox" id="ack" style="width:auto;min-height:0"> كتبتُ الرمز وحفظته</label>
   <button id="ok" style="width:100%" disabled>تم</button>`, {
    onMount: (b, close) => {
      $("#ack", b).onchange = e => $("#ok", b).disabled = !e.target.checked;
      $("#ok", b).onclick = close;
      $("#cp", b).onclick = () => { try { navigator.clipboard.writeText(code); toast("تم النسخ"); } catch { toast("انسخه يدوياً", true); } };
      $("#pr", b).onclick = () => { $("#receipt").innerHTML = `<div style="text-align:center"><h2>${esc(S.settings.shop_name || "")}</h2><p>رمز استعادة حساب المدير</p><h1 style="letter-spacing:3px;direction:ltr">${esc(code)}</h1><p>احفظ هذه الورقة بمكان آمن</p></div>`; window.print(); };
    }
  });
}
function recoverModal(uid, user) {
  modal("استعادة الرمز", `<p class="small mute">المستخدم: <b>${esc(user?.name || "")}</b>. أدخل رمز الاستعادة المكوّن من 16 خانة (الذي حصلت عليه عند الإعداد). إن كنت كاشيراً اطلب من المدير تغيير رمزك.</p>
   <div class="field"><label class="f">رمز الاستعادة</label><input id="c" class="num" placeholder="XXXX-XXXX-XXXX-XXXX" autocomplete="off"></div>
   <div class="grid g2"><div class="field"><label class="f">الرمز الجديد (4-12 رقماً)</label><input id="n1" type="password" inputmode="numeric" class="num"></div>
   <div class="field"><label class="f">تأكيد الرمز</label><input id="n2" type="password" inputmode="numeric" class="num"></div></div>
   <button id="s" style="width:100%">تغيير الرمز</button>
   <p class="small mute" style="margin-top:10px">لا تملك رمز الاستعادة؟ إن كان لديك جهاز آخر مرتبط فاطلب من المدير تغيير رمزك من الإعدادات ← المستخدمون. وإلا فهذا هو الخيار الأخير:</p><button class="bad" id="wipe" style="width:100%">مسح بيانات هذا الجهاز والبدء من جديد</button>`, {
    onMount: (b, close) => {
      $("#wipe", b).onclick = guard(async () => { if (await confirmBox("سيُحذف كل ما على هذا الجهاز (فواتير، أصناف، زبائن...) ولا يمكن التراجع. إن كان مربوطاً بجهاز آخر ستعود البيانات عند الربط من جديد. متابعة؟", "نعم، امسح", true)) { await api("device/reset", { method: "POST", body: { confirm: "RESET" } }); close(); toast("تمت إعادة الضبط. الرمز الافتراضي 1234"); location.reload(); } });
      $("#s", b).onclick = guard(async () => {
        if ($("#n1", b).value !== $("#n2", b).value) throw new Error("الرمزان غير متطابقين");
        const r = await api("recover", { method: "POST", body: { user_id: uid, code: $("#c", b).value, new_pin: $("#n1", b).value } });
        close(); toast("تم تغيير الرمز. سجّل الدخول به الآن."); showRecoveryCode(r.recovery_code);
      });
    }
  });
}

/* ============================== التحديثات ============================== */
const semGt = (a, b) => { const x = String(a).split(".").map(Number), y = String(b).split(".").map(Number); for (let i = 0; i < 3; i++) { if ((x[i] || 0) !== (y[i] || 0)) return (x[i] || 0) > (y[i] || 0); } return false; };
let UPD = { state: "idle" };
async function appVersion() { if (AGRI_HOST.version) return AGRI_HOST.version(); try { return (await (await fetch("version.json")).json()).version; } catch { return "?"; } }
async function checkAndroidUpdate() {           // الأندرويد: لا تحديث صامت، نعرض رابط تنزيل الـ APK الجديد
  let repo = ""; try { repo = (await (await fetch("update-config.json")).json()).repo; } catch { }
  if (!repo) return { state: "none" };
  const r = await fetch("https://api.github.com/repos/" + repo + "/releases/latest"); if (!r.ok) throw new Error("HTTP " + r.status);
  const j = await r.json(), v = String(j.tag_name || "").replace(/^v/, ""), cur = await appVersion(), apk = (j.assets || []).find(a => /\.apk$/i.test(a.name));
  return semGt(v, cur) && apk ? { state: "apk", version: v, url: apk.browser_download_url } : { state: "none" };
}
async function runUpdateCheck() {
  try { UPD = AGRI_HOST.checkUpdate ? await AGRI_HOST.checkUpdate() : await checkAndroidUpdate(); } catch (e) { UPD = { state: "error", message: e.message }; }
  drawUpd(); return UPD;
}
function drawUpd() {
  const st = $("#updst"), go = $("#updgo"); if (!st) return;
  const t = { idle: "", checking: "جارٍ البحث…", none: "أنت على آخر إصدار ✓", dev: "وضع التطوير (لا تحديث)", error: "تعذّر التحقق من التحديث" + (UPD.message ? " (" + UPD.message + ")" : ""),
    downloading: `يتم تنزيل الإصدار ${UPD.version || ""} (${UPD.percent || 0}%)…`, downloaded: `الإصدار ${UPD.version} جاهز للتثبيت`, apk: `يتوفر إصدار جديد ${UPD.version}` }[UPD.state] || "";
  appVersion().then(v => { st.textContent = "الإصدار الحالي: " + v + (t ? " — " + t : ""); });
  go.style.display = "none";
  if (UPD.state === "downloaded") { go.textContent = "إعادة التشغيل وتثبيت التحديث"; go.style.display = ""; go.onclick = () => AGRI_HOST.installUpdate(); }
  if (UPD.state === "apk") { go.textContent = "تنزيل التحديث"; go.style.display = ""; go.onclick = () => { location.href = UPD.url; }; }
}
function bindUpdates(main) { $("#updchk", main).onclick = () => { UPD = { state: "checking" }; drawUpd(); runUpdateCheck(); }; drawUpd(); if (UPD.state === "idle") runUpdateCheck(); }
if (AGRI_HOST.onUpdate) AGRI_HOST.onUpdate(st => { UPD = st; drawUpd(); if (st.state === "downloaded") toast("تحديث جديد جاهز — الإعدادات ← التحديثات"); });
setTimeout(() => { if (!AGRI_HOST.checkUpdate) runUpdateCheck().then(u => { if (u.state === "apk") toast("يتوفر إصدار جديد " + u.version + " (الإعدادات ← التحديثات)"); }); }, 15000);

/* ============================== واجهة الربط ============================== */
function qrSvg(text) {
  if (typeof qrcode === "undefined") return null;
  const q = qrcode(0, "L"); q.addData(text); q.make(); const n = q.getModuleCount(); let d = "";
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (q.isDark(r, c)) d += `M${c + 4} ${r + 4}h1v1h-1z`;
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${n + 8} ${n + 8}" style="width:100%;max-width:320px;display:block;margin:auto;background:#fff" shape-rendering="crispEdges"><rect width="100%" height="100%" fill="#fff"/><path d="${d}" fill="#000"/></svg>`;
}
async function joinWithCode(code, done) {
  const pk = await api("sync/pairing-peek", { method: "POST", body: { code } });
  const msg = pk.same ? "هذا الرمز لنفس مجموعتك. سيُضاف عنوان الجهاز للمزامنة." : `سيرتبط هذا الجهاز بمجموعة «${pk.name || "غير مسمّاة"}» وتُدمج بياناتك الحالية معها (لا يُحذف شيء). تأكد أنها صيدليتك نفسها. متابعة؟`;
  if (!(await confirmBox(msg, "ربط"))) return;
  await api("sync/join", { method: "POST", body: { code } }); toast("تم الربط، جارٍ المزامنة…");
  const r = await api("sync/now", { method: "POST" });
  toast(r.ok ? "تمت المزامنة" : "تم الربط. ستتم المزامنة عندما يتوفر الجهاز الآخر", !r.ok); done && done();
}
function bindSync(main, info) {
  $("#qrshow", main).onclick = guard(async () => {
    const r = await api("sync/pairing"), svg = qrSvg(r.code);
    modal("رمز الربط", `<p class="small mute">على الجهاز الآخر: الإعدادات ← «مسح رمز من جهاز آخر». هذا الرمز سرّي: من يملكه يستطيع الانضمام لبياناتك، لا تصوّره ولا ترسله لغيرك.</p>
      ${svg || '<div class="card small">تعذّر رسم QR على هذا الجهاز؛ استخدم الرمز النصي بالأسفل.</div>'}
      ${r.hosts.length ? "" : '<p class="small mute">لم يُكتشف عنوان شبكة محلية. المزامنة ستعتمد على الخادم الوسيط إن حددته.</p>'}
      <div class="field"><label class="f">الرمز النصي (بديل عن QR)</label><textarea id="code" readonly rows="3" style="direction:ltr;font-size:11px">${esc(r.code)}</textarea></div>
      <button class="sec" id="cc" style="width:100%">نسخ الرمز</button>`, { onMount: (b) => { $("#cc", b).onclick = () => { try { navigator.clipboard.writeText(r.code); toast("تم النسخ"); } catch { $("#code", b).select(); } }; } });
  });
  $("#syncnow", main).onclick = guard(async () => {
    const r = await api("sync/now", { method: "POST" });
    if (r.nothing) throw new Error("لا يوجد جهاز مرتبط بعد. اربط جهازاً بالـ QR أولاً.");
    toast(r.ok ? "تمت المزامنة ✓" : "تعذّر الوصول للجهاز الآخر (" + ((r.results[0] || {}).error || "") + ")", !r.ok); go("settings");
  });
  $("#relaysave", main).onclick = guard(async () => { await api("sync/relay", { method: "POST", body: { url: $("#relay", main).value } }); toast("تم الحفظ"); });
  $$("[data-rmremote]", main).forEach(b => b.onclick = guard(async () => { await api("sync/remote/remove", { method: "POST", body: { url: b.dataset.rmremote } }); go("settings"); }));
  $("#qrscan", main).onclick = () => {
    let stream = null, stop = false;
    const m = modal("مسح رمز الربط", `<video id="vid" playsinline muted style="width:100%;border-radius:10px;background:#000;max-height:50vh"></video><p class="small mute" id="scst">وجّه الكاميرا نحو رمز QR المعروض على الجهاز الآخر…</p>
      <div class="field"><label class="f">أو الصق الرمز النصي هنا</label><textarea id="pc" rows="2" style="direction:ltr"></textarea></div><button id="pj" style="width:100%">ربط بالرمز</button>`, {
      onClose: () => { stop = true; if (stream) stream.getTracks().forEach(t => t.stop()); },
      onMount: async (b, close) => {
        $("#pj", b).onclick = guard(async () => { const c = $("#pc", b).value.trim(); if (!c) return; close(); await joinWithCode(c, () => go("settings")); });
        try {
          if (typeof jsQR === "undefined") throw new Error("no jsQR");
          stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
          const v = $("#vid", b); v.srcObject = stream; await v.play(); const cv = document.createElement("canvas"), cx = cv.getContext("2d", { willReadFrequently: true });
          const tick = async () => {
            if (stop) return;
            if (v.videoWidth) { cv.width = v.videoWidth; cv.height = v.videoHeight; cx.drawImage(v, 0, 0); const r = jsQR(cx.getImageData(0, 0, cv.width, cv.height).data, cv.width, cv.height); if (r && /^AGRI1:/i.test(r.data)) { stop = true; close(); try { await joinWithCode(r.data, () => go("settings")); } catch (e) { toast(e.message, true); } return; } }
            requestAnimationFrame(tick);
          }; tick();
        } catch (e) { const st = $("#scst", b); if (st) st.textContent = "تعذّر تشغيل الكاميرا (تحقق من إذن الكاميرا). يمكنك لصق الرمز النصي بدلاً من ذلك."; }
      }
    });
  };
}

/* ============================== التشغيل ============================== */
(async () => { await ENGINE_READY.catch(e => { console.error(e); }); await showLogin(); })();
