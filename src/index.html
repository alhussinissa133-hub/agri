<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f6b3a">
<title>محاسبة الصيدلية الزراعية</title>
<script>try{document.documentElement.dataset.theme=localStorage.getItem("agri-theme")||"dark"}catch(e){document.documentElement.dataset.theme="dark"}</script>
<style>
:root{
  --bg:#f4f6f1; --card:#fff; --ink:#1d2a1f; --mute:#667365; --line:#dde3d8;
  --brand:#2f6b3a; --brand-ink:#fff; --brand-soft:#e4efe4; --warn:#b26a00; --warn-soft:#fff1d6;
  --bad:#b3261e; --bad-soft:#fde4e1; --ok:#1b7a3a; --shadow:0 1px 3px rgba(0,0,0,.08);
}
:root[data-theme="dark"]{--bg:#070b0c;--card:#0f1619;--ink:#e9f1ef;--mute:#7f9490;--line:#1b2a2d;--brand:#2fd0b5;--brand-ink:#03211d;
    --brand-soft:#10292a;--warn:#f0a94a;--warn-soft:#2e2412;--bad:#ff7f78;--bad-soft:#341a19;--ok:#43d9a0;--shadow:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic","Noto Sans Arabic",Arial,sans-serif;font-size:16px}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-height:44px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--brand);outline-offset:0}
textarea{min-height:70px}
button{cursor:pointer;border:0;border-radius:10px;padding:10px 16px;min-height:44px;background:var(--brand);color:var(--brand-ink);font-weight:600}
button.sec{background:var(--card);color:var(--ink);border:1px solid var(--line)}
button.bad{background:var(--bad);color:#fff}
button.ghost{background:transparent;color:var(--brand);padding:6px 10px;min-height:36px}
button:disabled{opacity:.5;cursor:not-allowed}
button.sm{min-height:36px;padding:6px 12px;font-size:14px}
.hidden{display:none!important}
.num{direction:ltr;unicode-bidi:plaintext;font-variant-numeric:tabular-nums}
.mute{color:var(--mute)} .small{font-size:13px}
.bad-t{color:var(--bad)} .ok-t{color:var(--ok)} .warn-t{color:var(--warn)}
.row{display:flex;gap:10px;align-items:center}.row.wrap{flex-wrap:wrap}.grow{flex:1;min-width:0}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:700px){.g3,.g4{grid-template-columns:repeat(2,1fr)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow)}
.tile .v{font-size:24px;font-weight:700;margin-top:2px}.tile .l{color:var(--mute);font-size:13px}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;background:var(--brand-soft);color:var(--brand)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.bad{background:var(--bad-soft);color:var(--bad)}
label.f{display:block;font-size:13px;color:var(--mute);margin:0 0 4px}
.field{margin-bottom:10px}
h2{margin:0 0 12px;font-size:20px} h3{margin:0 0 8px;font-size:16px}
table{width:100%;border-collapse:collapse}
th,td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:right;vertical-align:middle}
th{font-size:13px;color:var(--mute);font-weight:600;white-space:nowrap}
.scroll{overflow-x:auto}
.list>.item{display:flex;gap:10px;align-items:center;padding:11px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.list>.item:last-child{border-bottom:0}.list>.item:active{background:var(--brand-soft)}

/* layout */
#app{min-height:100vh;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;background:var(--brand);color:var(--brand-ink);display:flex;align-items:center;gap:10px;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top))}
.top .title{font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{background:rgba(255,255,255,.18);border-radius:99px;padding:6px 12px;font-size:14px;cursor:pointer;white-space:nowrap;border:0;color:inherit;min-height:36px}
.chip.stale{background:#b26a00;color:#fff}
.body{display:flex;flex:1;min-height:0}
nav.side{width:210px;background:var(--card);border-left:1px solid var(--line);padding:10px;position:sticky;top:56px;align-self:flex-start;height:calc(100vh - 56px);overflow:auto}
nav.side button{display:flex;gap:10px;width:100%;text-align:right;background:transparent;color:var(--ink);margin-bottom:4px;font-weight:500}
nav.side button.on{background:var(--brand-soft);color:var(--brand);font-weight:700}
main{flex:1;padding:14px;min-width:0;max-width:1200px;margin:0 auto;width:100%}
nav.bottom{display:none}
@media(max-width:820px){
  nav.side{display:none}
  nav.bottom{display:flex;position:fixed;bottom:0;inset-inline:0;background:var(--card);border-top:1px solid var(--line);z-index:20;padding-bottom:env(safe-area-inset-bottom);overflow-x:auto}
  nav.bottom button{flex:1;min-width:64px;background:transparent;color:var(--mute);flex-direction:column;display:flex;align-items:center;gap:2px;padding:6px 4px;font-size:11px;border-radius:0}
  nav.bottom button .ic{font-size:20px;line-height:1}
  nav.bottom button.on{color:var(--brand)}
  main{padding:12px 12px 90px}
}
/* modal & toast */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:700px){.ov{align-items:center}}
.modal{background:var(--card);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px}
@media(min-width:700px){.modal{border-radius:18px}}
.modal.wide{max-width:900px}
.modal h2{display:flex;justify-content:space-between;align-items:center}
.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 18px;border-radius:12px;z-index:99;max-width:90vw;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.toast.err{background:var(--bad);}
/* login */
.login{max-width:380px;margin:8vh auto;padding:20px}
.login h1{text-align:center;margin:0 0 4px;font-size:24px;color:var(--brand)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.pad button{font-size:22px;min-height:56px;background:var(--card);color:var(--ink);border:1px solid var(--line)}
.dots{display:flex;justify-content:center;gap:10px;margin:14px 0;min-height:18px}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--brand)}.dots i.f{background:var(--brand)}
.users{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:12px}
.users button{background:var(--card);color:var(--ink);border:2px solid var(--line)}.users button.on{border-color:var(--brand);color:var(--brand)}
/* POS */
.pos{display:grid;grid-template-columns:1.1fr 1fr;gap:12px;align-items:start}
@media(max-width:900px){.pos{grid-template-columns:1fr}}
.res{max-height:340px;overflow:auto}
.res .item small{color:var(--mute)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{background:var(--card);color:var(--ink);border-radius:0;min-height:38px;padding:6px 14px;font-weight:500}
.seg button.on{background:var(--brand);color:var(--brand-ink)}
.cartline{border-bottom:1px solid var(--line);padding:10px 0}
.cartline input{min-height:40px;padding:6px 8px}
.totals{background:var(--brand-soft);border-radius:12px;padding:12px;margin-top:10px}
.totals .big{font-size:26px;font-weight:800;color:var(--brand)}
.bar{height:10px;background:var(--brand);border-radius:5px;min-width:2px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px}
.tabs button{background:var(--card);color:var(--ink);border:1px solid var(--line);white-space:nowrap}
.tabs button.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.offline{background:var(--warn-soft);color:var(--warn);padding:8px 12px;border-radius:10px;margin-bottom:10px;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip2{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:8px 14px;min-height:44px;font-size:16px;cursor:pointer}
.chip2.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);font-weight:700}
.pcard{border:1px solid var(--line);border-radius:14px;background:var(--card);padding:12px;margin-bottom:10px}
.pcard h4{margin:0 0 6px;font-size:17px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.brow{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;background:var(--brand-soft);margin-top:6px;flex-wrap:wrap}
.brow.exp{background:var(--bad-soft)}.brow.soon{background:var(--warn-soft)}.brow.done{background:var(--brand-soft)}.brow.diff{background:var(--warn-soft)}
.pcard.done{border-color:var(--brand)}.prog{height:10px;border-radius:99px;background:var(--line);overflow:hidden}.prog>i{display:block;height:100%;background:var(--brand);transition:width .25s}
.okbtn{min-width:48px;background:var(--brand-soft);color:var(--brand);border:1px solid var(--brand)}.cathead{display:flex;align-items:center;gap:8px;margin:14px 0 6px;font-weight:700;color:var(--brand)}
details.card>summary{cursor:pointer;font-weight:600}details.card[open]>summary{margin-bottom:8px}
.brow .d{flex:1 1 150px;font-weight:700}.brow input{width:110px}
.brow.cl .d{flex:1 1 100%}.brow.cl input{flex:1;width:auto;min-width:90px;font-size:18px}.brow.cl button{min-width:52px}
@media(max-width:700px){.countbar{bottom:calc(66px + env(safe-area-inset-bottom))!important}.top .title{display:none}.top{justify-content:flex-start}.top .chip{flex:1;text-align:center;padding:6px 8px}}
.countbar{position:sticky;bottom:0;background:var(--card);border-top:2px solid var(--brand);padding:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;z-index:5}

/* ===== مظهر اللوحة الداكنة ===== */
:root[data-theme="dark"] body{background:radial-gradient(1200px 500px at 70% -10%,#0d2a28 0%,transparent 60%),var(--bg);background-attachment:fixed}
:root[data-theme="dark"] .top{background:rgba(15,22,25,.85);backdrop-filter:blur(8px);color:var(--ink);border-bottom:1px solid var(--line)}
:root[data-theme="dark"] .chip{background:#142226;border:1px solid var(--line)}
:root[data-theme="dark"] nav.side{background:transparent}
:root[data-theme="dark"] nav.side button.on{background:#12302e;color:var(--brand);box-shadow:inset -3px 0 0 var(--brand)}
:root[data-theme="dark"] .card{border-radius:18px;background:linear-gradient(180deg,#121b1e,#0e1518)}
.dgrid>*,.dgrid3>*{min-width:0}.vbars{overflow:hidden}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:12px}
.kpi{padding:6px 4px}.kpi .l{font-size:11px;letter-spacing:.04em;color:var(--mute);display:flex;gap:6px;align-items:center}
.kpi .v{font-size:34px;font-weight:300;line-height:1.15;margin-top:4px}
.badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:8px;background:var(--brand-soft);color:var(--ok);margin-inline-start:6px;vertical-align:middle}
.badge.w{background:var(--warn-soft);color:var(--warn)}.badge.b{background:var(--bad-soft);color:var(--bad)}
.dgrid{display:grid;grid-template-columns:1.5fr 1fr;gap:12px;margin-bottom:12px}
.dgrid3{display:grid;grid-template-columns:1fr 1.5fr 1fr;gap:12px}
@media(max-width:1000px){.dgrid,.dgrid3{grid-template-columns:1fr}}
.chead{display:flex;align-items:center;gap:10px;margin-bottom:10px}.chead .ic{width:30px;height:30px;border-radius:9px;background:var(--brand-soft);display:grid;place-items:center;font-size:15px}
.chead b{flex:1;font-weight:500}.rng{display:inline-flex;gap:2px;background:var(--bg);border-radius:99px;padding:3px}
.rng button{min-height:26px;padding:2px 12px;font-size:12px;background:transparent;color:var(--mute);border-radius:99px;font-weight:500}.rng button.on{background:var(--ink);color:var(--bg)}
.legend{display:flex;gap:22px;margin-bottom:6px}.legend div{font-size:11px;color:var(--mute)}.legend b{display:block;font-size:17px;font-weight:400;color:var(--ink)}
.chart{position:relative}.chart svg{width:100%;height:auto;display:block;direction:ltr}
.chart .ln{fill:none;stroke-width:2;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.4s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.chart .col{fill:transparent}.chart .col.on{fill:rgba(47,208,181,.16)}
.tip{position:absolute;top:8px;pointer-events:none;background:rgba(18,28,31,.95);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:12px;min-width:130px;opacity:0;transition:opacity .15s;z-index:3;direction:rtl}
.tip.on{opacity:1}.tip i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-inline-end:6px}.tip div{display:flex;justify-content:space-between;gap:14px;margin-top:3px}
.gw{position:relative;width:230px;max-width:100%;height:135px;flex:none}.gauge{display:flex;gap:14px;align-items:center;flex-wrap:wrap;justify-content:center}.gauge svg{width:230px;max-width:100%}
.gauge .mid{position:absolute;left:0;right:0;top:62px;text-align:center;font-size:44px;font-weight:300;pointer-events:none;direction:ltr}
.gbox{flex:1;min-width:150px;background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:14px;padding:12px}.gbox .t{font-size:10px;letter-spacing:.06em;color:var(--mute)}.gbox .n{font-size:28px;font-weight:300}
.vbars{display:flex;align-items:flex-end;gap:10px;height:190px;padding-top:6px}.vb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:2px;min-width:0}
.vb .seg2{width:100%;max-width:26px;height:5px;border-radius:2px;background:var(--brand);opacity:0;animation:pop .35s ease forwards}.vb .seg2.hi{background:#8af0dc}.vb .seg2.lo{background:#c24b4b}
@keyframes pop{to{opacity:.95}}.vb small{font-size:10px;color:var(--mute);margin-top:6px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.vb em{font-style:normal;font-size:11px}
.atab{display:flex;gap:14px;font-size:13px;margin-bottom:8px;color:var(--mute)}.atab button{background:transparent;color:var(--mute);min-height:28px;padding:2px 0;font-weight:500;border-radius:0;border-bottom:2px solid transparent}.atab button.on{color:var(--ink);border-color:var(--brand)}
.atab span{background:var(--bg);border-radius:6px;padding:0 6px;font-size:11px;margin-inline-start:4px}
.atable td,.atable th{padding:10px 6px}.atable tr[data-go]{cursor:pointer}.atable tr[data-go]:hover{background:rgba(47,208,181,.06)}
.st{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;background:var(--brand-soft);color:var(--brand)}.st.w{background:var(--warn-soft);color:var(--warn)}.st.b{background:var(--bad-soft);color:var(--bad)}
.ai{position:relative;overflow:hidden;text-align:center;background:radial-gradient(260px 200px at 50% 20%,rgba(47,208,181,.25),transparent 70%),#0b1214!important}
.orb{width:64px;height:64px;border-radius:50%;margin:6px auto 10px;background:radial-gradient(circle at 50% 60%,#05090a 55%,#2fd0b5 58%,#0f6f63 75%,transparent 77%);box-shadow:0 0 30px rgba(47,208,181,.55),inset 0 0 12px rgba(47,208,181,.6);animation:orb 3.2s ease-in-out infinite}
@keyframes orb{50%{box-shadow:0 0 52px rgba(47,208,181,.85),inset 0 0 18px rgba(47,208,181,.8);transform:scale(1.05)}}
.ai .t{font-size:13px}.ai .s{font-size:11px;color:var(--mute)}.ai .msg{font-size:18px;margin:12px 0;line-height:1.5}
.ai .pr{height:4px;border-radius:9px;background:#1b2a2d;overflow:hidden;margin:10px 0 14px}.ai .pr i{display:block;height:100%;background:linear-gradient(90deg,var(--warn),#ffd27a)}
.ai .btns{display:flex;gap:8px;justify-content:center}.ai .btns button{border-radius:99px;padding:8px 20px}
.fade{animation:fade .5s ease both}@keyframes fade{from{opacity:0;transform:translateY(8px)}}
#receipt{display:none}
@media print{
  body *{visibility:hidden} #receipt,#receipt *{visibility:visible}
  #receipt{display:block;position:absolute;inset:0;padding:8mm;color:#000;background:#fff;font-size:13px}
  #receipt table td,#receipt table th{padding:3px 2px;color:#000;border-bottom:1px dashed #999}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="receipt"></div>
<script src="seed-data.js"></script>
<script src="engine.js"></script>
<script src="store-idb.js"></script>
<script>
"use strict";
/* ============================== أدوات ============================== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const AR = { "أ": "ا", "إ": "ا", "آ": "ا", "ٱ": "ا", "ة": "ه", "ى": "ي", "ؤ": "و", "ئ": "ي" };
const norm = s => String(s ?? "").replace(/[ً-ٰٟـ]/g, "").replace(/[أإآٱةىؤئ]/g, c => AR[c]).toLowerCase().replace(/\s+/g, " ").trim();
const r2 = x => Math.round((+x + Number.EPSILON) * 100) / 100;
const num = (n, d = 2) => (+n || 0).toLocaleString("en", { maximumFractionDigits: d });
const usd = n => { n = +n || 0; return (n < 0 ? "-" : "") + "$" + Math.abs(n).toLocaleString("en", { minimumFractionDigits: 2, maximumFractionDigits: 2 }); };
const syp = n => num(n, 2) + " ل.س";
const money = (n, cur) => cur === "USD" ? usd(n) : syp(n);
const arDate = s => (s || "").slice(0, 16).replace("T", " ");
const todayStr = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : "u" + Date.now() + Math.random().toString(16).slice(2));
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch { } }
};

const S = { token: null, user: null, rate: null, settings: {}, products: [], customers: [], suppliers: [], view: "dash", cart: null };
const UNIT_PACK = "pack";

function toast(msg, err) {
  $$(".toast").forEach(x => x.remove());
  const t = document.createElement("div"); t.className = "toast" + (err ? " err" : ""); t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), err ? 5000 : 2600);
}

/* ===== المحرك المحلي (يعمل داخل الجهاز بدون سيرفر) ===== */
let ENGINE = null;
const AGRI_HOST = window.agriHost || {};
const IS_NATIVE = !!(window.Capacitor && Capacitor.isNativePlatform && Capacitor.isNativePlatform());
const ENGINE_READY = (async () => {
  let defaultRelay = ""; try { defaultRelay = (await (await fetch("relay-config.json")).json()).url || ""; } catch { }
  ENGINE = await PharmaEngine.create({
    store: new IdbStore(), seed: PHARMA_SEED, defaultRelay,
    fetchText: AGRI_HOST.fetchText ? u => AGRI_HOST.fetchText(u) : async u => (await fetch(u)).text(),
    getHosts: AGRI_HOST.lanHosts ? () => AGRI_HOST.lanHosts() : async () => []
  });
  if (AGRI_HOST.onSyncRequest) AGRI_HOST.onSyncRequest(req => ENGINE.handleSyncRequest(req).then(r => ({ ok: true, res: r }), e => ({ ok: false, status: e.status || 500, error: e.message })));
  ENGINE.startAuto(30000); ENGINE.on("sync", () => drawSync()); setInterval(() => drawSync(), 10000);
  const rateTick = () => ENGINE.autoRefreshRate().then(r => { if (r && S.user) { S.rate = r.use ? r : S.rate; try { drawRate(); } catch { } } });
  setTimeout(rateTick, 3000); setInterval(rateTick, 10 * 60000);
  ENGINE.on("change", ev => { if (ev && !ev.local && S.user) { clearTimeout(window.__rf); window.__rf = setTimeout(() => { try { loadBasics().then(() => { drawRate(); if (!$(".ov")) go(S.view); }); } catch { } }, 400); } });
})();
async function api(path, opt = {}) {
  await ENGINE_READY;
  try { return await ENGINE.api(opt.method || "GET", path, opt.body, {}); }
  catch (e) {
    if (e.status === 401 && path !== "login") { doLogout(true); throw new Error("انتهت الجلسة"); }
    throw Object.assign(new Error(e.error || e.message || "خطأ"), { status: e.status || 500 });
  }
}
const NORM = x => PharmaEngine.normDigits(x);
const guard = fn => async (...a) => { try { return await fn(...a); } catch (e) { toast(e.message || "خطأ", true); } };

function modal(title, html, { wide = false, onMount, onClose } = {}) {
  const ov = document.createElement("div"); ov.className = "ov";
  ov.innerHTML = `<div class="modal ${wide ? "wide" : ""}"><h2><span>${title}</span><button class="ghost" data-close>✕</button></h2><div class="mbody">${html}</div></div>`;
  const close = () => { ov.remove(); onClose && onClose(); };

/* ============================== الأسعار ============================== */
const rateUse = () => S.rate?.use || 0;
function priceBase(p, cur, tier) {            // سعر الوحدة الأساسية
  const rate = (S.view === "pos" && S.cart && S.cart.rate) || rateUse(), w = tier === "w";
  let u, s;
  if (p.price_mode === "SYP") { s = (w && p.price_wholesale_syp) ? p.price_wholesale_syp : p.price_syp; u = rate ? s / rate : 0; }
  else { u = (w && p.price_wholesale_usd) ? p.price_wholesale_usd : p.price_usd; s = u * rate; }
  return cur === "USD" ? r2(u) : (S.settings.round_syp === "1" ? Math.round(s) : r2(s));
}
const r3 = x => Math.round((+x + Number.EPSILON) * 1000) / 1000;
const unitsOf = p => PharmaEngine.unitsFor(p);
const unitLabel = (p, key) => (unitsOf(p).find(u => u.key === key) || { label: p.unit }).label;
const isPackKey = k => /^(pack|pk)/.test(k || "");
const unitF = (p, unit, size) => isPackKey(unit) && +size > 0 ? +size : (unitsOf(p).find(u => u.key === (unit || "base")) || { f: 1 }).f;
function priceFor(p, cur, tier, unit, size) {
  const b = priceBase(p, cur, tier), f = unitF(p, unit, size);
  if (f === 1) return b;
  const v = b * f; return cur === "USD" ? (v < 1 ? r3(v) : r2(v)) : (S.settings.round_syp === "1" ? Math.round(v) : r2(v));
}
function stockText(p) {
  const st = p.stock || 0;
  if (p.pack_unit && p.pack_factor > 1 && st >= p.pack_factor) {
    const packs = Math.floor(st / p.pack_factor + 1e-9), rem = r2(st - packs * p.pack_factor);
    return `${num(packs)} ${p.pack_unit.split(" ")[0]}` + (rem ? ` + ${num(rem)} ${p.unit}` : "");
  }
  return `${num(st, 3)} ${p.unit}`;
}

    let pts = d.series.slice(-rng); if (rng === 90) { const g = []; for (let i = 0; i < pts.length; i += 3) { const c = pts.slice(i, i + 3); g.push({ d: c[0].d, sales: c.reduce((a, x) => a + x.sales, 0), purchases: c.reduce((a, x) => a + x.purchases, 0) }); } pts = g; }
    const n = pts.length, mx = Math.max(1, ...pts.map(p => Math.max(p.sales, p.purchases))) * 1.15, X = i => PL + (W - 2 * PL) * (n === 1 ? .5 : i / (n - 1)), Y = v => H - PB - (H - PB - 10) * v / mx;
    const path = k => { const P = pts.map((p, i) => [X(i), Y(p[k])]); let t = `M${P[0][0]},${P[0][1]}`; for (let i = 0; i < P.length - 1; i++) { const a = P[i - 1] || P[i], b = P[i], c = P[i + 1], e = P[i + 2] || c; t += ` C${b[0] + (c[0] - a[0]) / 6},${b[1] + (c[1] - a[1]) / 6} ${c[0] - (e[0] - b[0]) / 6},${c[1] - (e[1] - b[1]) / 6} ${c[0]},${c[1]}`; } return t; };
    const pa = path("sales"), pb = path("purchases"), back = pb.replace(/^M/, "L");
    const rev = pts.map((p, i) => [X(i), Y(p.purchases)]).reverse(); let area = pa; area += ` L${rev[0][0]},${rev[0][1]}`; for (let i = 0; i < rev.length - 1; i++) { const a = rev[i - 1] || rev[i], b = rev[i], c = rev[i + 1], e = rev[i + 2] || c; area += ` C${b[0] + (c[0] - a[0]) / 6},${b[1] + (c[1] - a[1]) / 6} ${c[0] - (e[0] - b[0]) / 6},${c[1] - (e[1] - b[1]) / 6} ${c[0]},${c[1]}`; } area += "Z";
    const cw = (W - 2 * PL) / n, tot = pts.reduce((a, p) => [a[0] + p.sales, a[1] + p.purchases], [0, 0]);
    $("#lgd").innerHTML = `<div>مبيعات<b class="num">${usd(tot[0])}</b></div><div>مشتريات<b class="num">${usd(tot[1])}</b></div><div>الفرق<b class="num ${tot[0] - tot[1] < 0 ? "warn-t" : "ok-t"}">${usd(tot[0] - tot[1])}</b></div>`;
    const step = Math.max(1, Math.ceil(n / 6));
    $("#chart").innerHTML = `<svg viewBox="0 0 ${W} ${H}"><defs><pattern id="hat" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#2fd0b5" stroke-opacity=".35" stroke-width="2"/></pattern></defs>
      ${pts.map((p, i) => `<rect class="col" data-i="${i}" x="${X(i) - cw / 2 + 2}" y="0" width="${Math.max(2, cw - 4)}" height="${H - PB}" rx="6"/>`).join("")}
      <path d="${area}" fill="url(#hat)"/><path class="ln" pathLength="1" d="${pa}" stroke="#2fd0b5"/><path class="ln" pathLength="1" d="${pb}" stroke="#cfd9d7" stroke-opacity=".8"/>
      ${pts.map((p, i) => i % step === 0 ? `<text x="${X(i)}" y="${H - 6}" fill="#7f9490" font-size="11" text-anchor="middle">${p.d.slice(5)}</text>` : "").join("")}
      <g id="dots"></g></svg><div class="tip" id="tip"></div>`;
    const svg = $("#chart svg"), tip = $("#tip");
    const show = i => { $$(".col", svg).forEach(c => c.classList.toggle("on", +c.dataset.i === i)); const p = pts[i];
      $("#dots", svg).innerHTML = `<circle cx="${X(i)}" cy="${Y(p.sales)}" r="4" fill="#fff" stroke="#2fd0b5" stroke-width="2"/><circle cx="${X(i)}" cy="${Y(p.purchases)}" r="4" fill="#fff" stroke="#9aa"/>`;
      tip.innerHTML = `<div style="color:var(--mute)"><span>${p.d}</span></div><div><span><i style="background:#2fd0b5"></i>مبيعات</span><b class="num">${usd(p.sales)}</b></div><div><span><i style="background:#cfd9d7"></i>مشتريات</span><b class="num">${usd(p.purchases)}</b></div>`;
      const r = svg.getBoundingClientRect(), x = X(i) / W * r.width; tip.style.left = Math.max(0, Math.min(r.width - 150, x + 10)) + "px"; tip.classList.add("on"); };
    const at = ev => { const r = svg.getBoundingClientRect(), cx = (ev.touches ? ev.touches[0].clientX : ev.clientX) - r.left; show(Math.max(0, Math.min(n - 1, Math.round(cx / r.width * W / ((W - 2 * PL) / Math.max(1, n - 1)) - PL / ((W - 2 * PL) / Math.max(1, n - 1)))))); };
    svg.onmousemove = at; svg.ontouchstart = svg.ontouchmove = at; svg.onmouseleave = () => { tip.classList.remove("on"); $$(".col", svg).forEach(c => c.classList.remove("on")); $("#dots", svg).innerHTML = ""; };
  };
  $$("#rng button").forEach(b => b.onclick = () => { rng = +b.dataset.r; $$("#rng button").forEach(x => x.classList.toggle("on", x === b)); draw(); });
  draw();
  /* ---- المقياس ---- */
  const pct = d.health.pct, T = 40, cx = 115, cy = 115, ticks = []; 
  for (let i = 0; i < T; i++) { const a = Math.PI * (1 - i / (T - 1)), r1 = 80, r2_ = i % 5 === 0 ? 106 : 98, on = i / (T - 1) * 100 <= pct; ticks.push(`<line x1="${cx + r1 * Math.cos(a)}" y1="${cy - r1 * Math.sin(a)}" x2="${cx + r2_ * Math.cos(a)}" y2="${cy - r2_ * Math.sin(a)}" stroke="${on ? (pct < 60 ? "#f0a94a" : "#2fd0b5") : "#27363a"}" stroke-width="2.4" stroke-linecap="round" style="animation:fade .4s ${i * 25}ms both"/>`); }
  $("#gauge").innerHTML = `<div class="gw"><svg viewBox="0 0 230 130">${ticks.join("")}</svg><div class="mid"><span class="num" id="gn">0</span><small style="font-size:16px;color:var(--mute)">%</small><div class="small mute" style="font-size:11px">${d.health.ok} من ${d.health.total} صنف سليم</div></div></div>
    <div class="gbox"><div class="t">إن لم يتغير شيء</div><div class="n">${firstExp ? (firstExp.days < 0 ? "0" : firstExp.days) : "—"}<small style="font-size:13px;color:var(--mute)"> يوم</small></div><div class="small mute">حتى انتهاء أول دفعة</div><div class="n" style="margin-top:6px">${exp30}</div><div class="small mute">دفعات تنتهي خلال 30 يوماً</div></div>`;
  { const el = $("#gn"), t0 = performance.now(); const tick = t => { const k = Math.min(1, (t - t0) / 900); el.textContent = Math.round(pct * (1 - Math.pow(1 - k, 3))); if (k < 1) requestAnimationFrame(tick); }; requestAnimationFrame(tick); }
  /* ---- أعمدة الفئات ---- */
  const cats = d.categories, cmax = Math.max(1, ...cats.map(c => c.usd));
  $("#vbars").innerHTML = cats.length ? cats.map((c, i) => { const k = Math.max(1, Math.round(c.usd / cmax * 16)); return `<div class="vb" title="${esc(c.name)}: ${usd(c.usd)}"><em class="num">${Math.round(c.usd)}</em>${Array.from({ length: k }, (_, j) => `<div class="seg2 ${i === 0 && j === k - 1 ? "hi" : ""}" style="animation-delay:${(j + i) * 30}ms"></div>`).join("")}<small>${esc(c.name)}</small></div>`; }).join("") : `<div class="mute small" style="margin:auto">لا مبيعات هذا الشهر بعد</div>`;
  /* ---- جدول يحتاج انتباه ---- */
  let tab = ins.tab || "low";
  const drawA = () => {
    $("#atab").innerHTML = [["low", "نواقص", A.low.length], ["exp", "صلاحية", A.expiring.length], ["debt", "ديون", A.debts.length]].map(t => `<button data-t="${t[0]}" class="${tab === t[0] ? "on" : ""}">${t[1]}<span>${t[2]}</span></button>`).join("");
    $$("#atab button").forEach(b => b.onclick = () => { tab = b.dataset.t; drawA(); });
    const rows = tab === "low" ? A.low.map(x => `<tr data-go="inventory"><td>${esc(x.name)}</td><td class="num">${num(x.stock)} / ${num(x.min)}</td><td><span class="st ${x.stock <= 0 ? "b" : "w"}">${x.stock <= 0 ? "نفد" : "ناقص"}</span></td></tr>`)
      : tab === "exp" ? A.expiring.map(x => `<tr data-go="inventory"><td>${esc(x.name)}</td><td class="num small">${esc(x.expiry)}</td><td><span class="st ${x.days < 0 ? "b" : x.days <= 30 ? "w" : ""}">${x.days < 0 ? "منتهية" : x.days + " يوم"}</span></td></tr>`)
      : A.debts.map(x => `<tr data-go="customers"><td>${esc(x.name)}</td><td class="num">${usd(x.usd)}</td><td><span class="st w">${x.last ? "آخر دفعة " + x.last.slice(5, 10) : "بلا دفعات"}</span></td></tr>`);
    $("#atable").innerHTML = `<table class="atable"><tbody>${rows.join("") || `<tr><td class="mute" style="text-align:center">لا شيء هنا 👌</td></tr>`}</tbody></table>`;
    $$("#atable [data-go]").forEach(e => e.onclick = () => go(e.dataset.go));
  };
  drawA();
  if ($("#aiGo")) $("#aiGo").onclick = () => { tab = ins.tab; drawA(); $("#atable").scrollIntoView({ behavior: "smooth", block: "center" }); };
  $("#aiNo").onclick = () => { $("#ai").style.display = "none"; };
};

/* ============================== نقطة البيع ============================== */
function newCart() { return { edit: null, rate: null, date: "", origDate: "", cur: "SYP", tier: "r", items: [], customer_id: null, discount: "", paid: null, note: "" }; }

  <div class="pos">
    <div class="card"><h3>الأصناف</h3>
      <input id="q" placeholder="ابحث بالاسم أو المادة الفعالة أو الباركود…" autocomplete="off">
      <div class="res list" id="res" style="margin-top:8px"></div></div>

        <div class="seg" id="tierSeg"><button data-t="r">مفرق</button><button data-t="w">جملة</button></div>
        <div class="grow"></div><button class="ghost" id="clr">تفريغ</button></div>
      <div id="cart"></div><div id="totals"></div></div>
  </div>`;
  const draw = () => { drawSeg(); drawCart(); drawRes(); };
  const drawSeg = () => {
    $$("#curSeg button", main).forEach(b => b.classList.toggle("on", b.dataset.c === cart.cur));
    $$("#tierSeg button", main).forEach(b => b.classList.toggle("on", b.dataset.t === cart.tier));
  };
  const reprice = () => cart.items.forEach(i => i.price = priceFor(i.p, cart.cur, cart.tier, i.unit, i.size));
  $$("#curSeg button", main).forEach(b => b.onclick = () => {
    if (b.dataset.c === cart.cur) return;
    if (cart.paid !== null) { const t = total(); cart.paid = null; }
    cart.cur = b.dataset.c; reprice(); draw();
  });
  $$("#tierSeg button", main).forEach(b => b.onclick = () => { cart.tier = b.dataset.t; reprice(); draw(); });
  $("#clr", main).onclick = () => { S.cart = newCart(); VIEWS.pos(main); };
  $("#cdate", main).onchange = e => { cart.date = e.target.value; };
  $("#crate", main).onchange = e => { const v = +NORM(e.target.value); cart.rate = v >= 10 && v <= 3000 ? v : null; if (!cart.edit) { reprice(); drawCart(); } else toast("اضغط «إعادة تسعير» إن أردت تغيير الأسعار بهذا السعر"); };

  function drawRes() {

  };

    box.innerHTML = cart.items.map((i, idx) => `
      <div class="cartline" data-i="${idx}">
        <div class="row"><b class="grow">${esc(i.p.name)}</b><button class="ghost bad-t" data-del>✕</button></div>
        <div class="row wrap" style="margin-top:6px">
          <div style="width:96px"><label class="f">الكمية</label><input class="num" data-qty inputmode="decimal" value="${i.qty}"></div>
          <div style="flex-basis:100%;order:-1">${unitsOf(i.p).length > 1 ? `<label class="f">بأي وحدة تبيع؟</label><div class="chips">${unitsOf(i.p).map(u => `<button type="button" class="chip2 ${i.unit === u.key ? "on" : ""}" data-uk="${u.key}">${esc(u.label)}</button>`).join("")}</div>` : `<span class="mute small">الوحدة: ${esc(i.p.unit)}</span>`}</div>
          ${isPackKey(i.unit) ? `<div style="width:150px"><label class="f">وزن هذه العبوة (${esc(i.p.unit)})</label><input class="num" data-size inputmode="decimal" value="${i.size || unitF(i.p, i.unit)}"></div>` : ""}
          <div class="grow"><label class="f">السعر (${cart.cur === "USD" ? "$" : "ل.س"})</label><input class="num" data-price inputmode="decimal" value="${i.price}"></div>
          <div style="min-width:90px;text-align:left" class="num"><label class="f">المجموع</label><b>${money(r2(i.qty * i.price), cart.cur)}</b></div>

    $$(".cartline", box).forEach(el => {

      $("[data-qty]", el).oninput = e => { i.qty = Math.max(0, +e.target.value || 0); drawTotals(); $(".num b", el).textContent = money(r2(i.qty * i.price), cart.cur); };
      $("[data-price]", el).oninput = e => { i.price = Math.max(0, +e.target.value || 0); drawTotals(); $(".num b", el).textContent = money(r2(i.qty * i.price), cart.cur); };
      $$("[data-uk]", el).forEach(bt => bt.onclick = () => { i.unit = bt.dataset.uk; i.size = null; i.price = priceFor(i.p, cart.cur, cart.tier, i.unit); drawCart(); });
      const sz = $("[data-size]", el); if (sz) sz.oninput = e => { i.size = Math.max(0, +NORM(e.target.value) || 0) || null; i.price = priceFor(i.p, cart.cur, cart.tier, i.unit, i.size); $("[data-price]", el).value = i.price; drawTotals(); $(".num b", el).textContent = money(r2(i.qty * i.price), cart.cur); };
    });
    drawTotals(true);

    const t = total(), paid = cart.paid === null ? t : Math.min(+cart.paid || 0, t);
    if (t - paid > 0.004 && !cart.customer_id) return toast("اختر زبوناً لتسجيل الدين", true);
    const body = {
      uuid: uuid(), ts: new Date(Date.now() - new Date().getTimezoneOffset() * 6e4).toISOString().slice(0, 19).replace("T", " "),
      currency: cart.cur, rate: cart.rate || rateUse(), ts: (cart.date && cart.date !== cart.origDate) ? cart.date : undefined, customer_id: cart.customer_id, discount: +cart.discount || 0, paid, note: cart.note,
      items: cart.items.map(i => ({ product_id: i.p.id, qty: i.qty, unit: i.unit, size: i.size || undefined, price: i.price }))
    };
    $("#save", main).disabled = true;
    try {
      const r = cart.edit ? await api("sales/" + cart.edit.id + "/edit", { method: "POST", body }) : await api("sales", { method: "POST", body }); if (cart.edit) toast("تم تعديل الفاتورة");
      if (r.over_credit_limit) toast("تنبيه: الزبون تجاوز حد الدين المسموح", true);
      S.cart = newCart(); showReceipt(r); VIEWS.pos(main);
    } catch (e) {
      throw e;
    } finally { const b = $("#save", main); if (b) b.disabled = false; }
  });
  const q = pendingQueue().length;
  $("#offbar", main).innerHTML = q ? `<div class="offline">⚠ ${q} فاتورة بانتظار الإرسال للسيرفر (ستُرسل تلقائياً)</div>` : "";
  draw();
};
async function flushPending() { return; /* لم يعد لازماً: الحفظ محلي دائماً */
  const q = pendingQueue(); if (!q.length || !S.token) return;
  const rest = [];
  for (const b of q) {
    try { await api("sales", { method: "POST", body: b }); }
    catch (e) { if (!e.status) rest.push(b); else { toast("فاتورة محفوظة محلياً رُفضت: " + e.message, true); rest.push({ ...b, _err: e.message }); } }
  }
  store.set("pending_sales", rest.filter(x => !x._err));
  if (q.length !== rest.length) toast("تم إرسال " + (q.length - rest.length) + " فاتورة محفوظة");
}
setInterval(flushPending, 20000); window.addEventListener("online", flushPending);

/* ============================== التحديثات ============================== */
const semGt = (a, b) => { const x = String(a).split(".").map(Number), y = String(b).split(".").map(Number); for (let i = 0; i < 3; i++) { if ((x[i] || 0) !== (y[i] || 0)) return (x[i] || 0) > (y[i] || 0); } return false; };
let UPD = { state: "idle" };
async function appVersion() { if (AGRI_HOST.version) return AGRI_HOST.version(); try { return (await (await fetch("version.json")).json()).version; } catch { return "?"; } }
async function checkAndroidUpdate() {           // الأندرويد: لا تحديث صامت، نعرض رابط تنزيل الـ APK الجديد
  let repo = ""; try { repo = (await (await fetch("update-config.json")).json()).repo; } catch { }
  if (!repo) return { state: "none" };
  const r = await fetch("https://api.github.com/repos/" + repo + "/releases/latest"); if (!r.ok) throw new Error("HTTP " + r.status);
  const j = await r.json(), v = String(j.tag_name || "").replace(/^v/, ""), cur = await appVersion(), apk = (j.assets || []).find(a => /\.apk$/i.test(a.name));
  return semGt(v, cur) && apk ? { state: "apk", version: v, url: apk.browser_download_url } : { state: "none" };
}
async function runUpdateCheck() {
  try { UPD = AGRI_HOST.checkUpdate ? await AGRI_HOST.checkUpdate() : await checkAndroidUpdate(); } catch (e) { UPD = { state: "error", message: e.message }; }
  drawUpd(); return UPD;
}
function drawUpd() {
  const st = $("#updst"), go = $("#updgo"); if (!st) return;
  const t = { idle: "", checking: "جارٍ البحث…", none: "أنت على آخر إصدار ✓", dev: "وضع التطوير (لا تحديث)", error: "تعذّر التحقق من التحديث" + (UPD.message ? " (" + UPD.message + ")" : ""),

      ${ls.map(l => { const st = expState(l.days, warn), v = C[l.k] ?? "";
        return `<div class="brow cl ${st}" data-line="${esc(l.k)}"><div class="d">${l.whole ? "الكمية الإجمالية" : "📅 " + (l.exp ? esc(l.exp) : "بدون تاريخ")} ${st === "exp" ? '<span class="bad-t">(منتهية)</span>' : st === "soon" ? '<span class="warn-t">(قريبة)</span>' : ""}<div class="small mute">${l.whole ? "" : "دفعة: " + esc(l.bno || "-") + " — "}النظام ${num(l.sys, 3)} ${esc(r.unit)}</div></div>

    $$("[data-addb]", main).forEach(b => b.onclick = () => addBatchModal(d.rows.find(r => r.id === b.dataset.addb), () => VIEWS.stocktake(main)));
  };
  main.innerHTML = `<div class="row"><h2 class="grow" style="margin:0">📝 الجرد</h2><button class="sec sm" id="sprint">🖨 ورقة</button></div>

  <h2>المشتريات</h2>${tb(["التاريخ", "المورد", "رقم الفاتورة", "المجموع", "المدفوع"], r.purchases.map(x => `<tr><td>${E(x.ts.slice(0, 10))}</td><td>${E(x.supplier || "نقدي")}</td><td>${E(x.invoice_no || "")}</td><td class="num">${m(x.total, x.currency)}</td><td class="num">${m(x.paid, x.currency)}</td></tr>`))}
  <h2>قائمة الفواتير</h2>${tb(["الرقم", "التاريخ", "الزبون", "المجموع", "المدفوع", "المتبقي"], r.sales.map(x => `<tr><td>${E(x.number)}</td><td>${E(x.ts.slice(0, 16))}</td><td>${E(x.customer || "نقدي")}</td><td class="num">${m(x.total, x.currency)}</td><td class="num">${m(x.paid, x.currency)}</td><td class="num">${x.remaining > 0.004 ? m(x.remaining, x.currency) : "—"}</td></tr>`))}
  </body></html>`;
}
async function savePdfReport(r) {
  const name = `${(S.settings.shop_name || "Pharmacy").replace(/[^\w؀-ۿ ]/g, "")} - ${r.label.replace(/[^\w؀-ۿ ]/g, "")}.pdf`, html = yearReportHTML(r);
  if (AGRI_HOST.savePdf) { const o = await AGRI_HOST.savePdf(html, name); if (o && o.path) { toast("تم حفظ الملف: " + o.path); return true; } return false; }
  const w = window.open("", "_blank"); if (!w) throw new Error("حفظ PDF متاح من نسخة الكمبيوتر (ثبّت برنامج الكمبيوتر وربطه بالـ QR)");
  w.document.write(html); w.document.close(); setTimeout(() => w.print(), 400); return true;
}

  $("#yrclose", main).onclick = guard(async () => {

    modal("🔒 إقفال السنة", `<div class="card small"><b>ما الذي سيحدث؟</b><br>• الفواتير والمشتريات والمصاريف والأرباح تبدأ من الصفر.<br>• <b>تبقى كما هي:</b> المخزون، الأصناف، الزبائن، ديون الزبائن ومستحقات الموردين غير المدفوعة (تُرحَّل رصيداً افتتاحياً)، ورصيد الصندوق.<br>• لا يُحذف شيء: الفواتير القديمة تبقى محفوظة ويمكنك طباعة PDF لها من «السنوات المقفلة» لكن لا تُعدَّل.</div>
      <p class="small">السنة الحالية: ${r.summary.invoices} فاتورة، مبيعات ${usd(r.summary.revenue_usd)}، ربح صافٍ ${usd(r.summary.net_usd)}.</p>
      <div class="field"><label class="f">اسم هذه السنة (يظهر بالتقرير)</label><input id="yl" value="${new Date().getFullYear()}"></div>
      <button class="sec" id="y1" style="width:100%">1) 📄 حفظ نسخة PDF لهذه السنة</button>
      ${canPdf ? "" : '<label class="row small" style="margin:8px 0"><input type="checkbox" id="yack" style="width:auto;min-height:0"> أعلم أن PDF يُحفظ من نسخة الكمبيوتر ولا مانع من الإقفال الآن</label>'}
      <div class="field"><label class="f">رمزك السري للتأكيد</label><input id="yp" type="password" inputmode="numeric" class="num"></div>
      <button class="bad" id="y2" style="width:100%" disabled>2) 🔒 إقفال السنة</button>`, {
      onMount: (b, close) => {

        $("#y1", b).onclick = guard(async () => { r.label = $("#yl", b).value.trim() || r.label; const ok = await savePdfReport(Object.assign({}, r, { label: $("#yl", b).value.trim() || r.label })); if (ok) { saved = true; chk(); } });
        if ($("#yack", b)) $("#yack", b).onchange = chk;
        $("#y2", b).onclick = guard(async () => { await api("year/close", { method: "POST", body: { label: $("#yl", b).value, pin: $("#yp", b).value } }); close(); toast("تم إقفال السنة. بدأت سنة جديدة والديون مرحّلة"); go("settings"); });
      }

/* ============================== واجهة الربط ============================== */
const loadLib = src => new Promise(res => { if (document.querySelector(`script[data-lib="${src}"]`)) return res(true); const t = document.createElement("script"); t.src = src; t.dataset.lib = src; t.onload = () => res(true); t.onerror = () => { t.remove(); res(false); }; document.head.appendChild(t); });
async function qrSvg(text) {
  await loadLib("lib/qrcode.js"); if (typeof qrcode === "undefined") return null;
  const q = qrcode(0, "L"); q.addData(text); q.make(); const n = q.getModuleCount(); let d = "";
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (q.isDark(r, c)) d += `M${c + 4} ${r + 4}h1v1h-1z`;
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${n + 8} ${n + 8}" style="width:100%;max-width:320px;display:block;margin:auto;background:#fff" shape-rendering="crispEdges"><rect width="100%" height="100%" fill="#fff"/><path d="${d}" fill="#000"/></svg>`;
}
async function joinWithCode(code, done) {
  const pk = await api("sync/pairing-peek", { method: "POST", body: { code } });
  const msg = pk.same ? "هذا الرمز لنفس مجموعتك. سيُضاف عنوان الجهاز للمزامنة." : `سيرتبط هذا الجهاز بمجموعة «${pk.name || "غير مسمّاة"}» وتُدمج بياناتك الحالية معها (لا يُحذف شيء). تأكد أنها صيدليتك نفسها. متابعة؟`;
  if (!(await confirmBox(msg, "ربط"))) return;
  await api("sync/join", { method: "POST", body: { code } }); toast("تم الربط، جارٍ المزامنة…");
  const r = await api("sync/now", { method: "POST" });
  toast(r.ok ? "تمت المزامنة" : "تم الربط. ستتم المزامنة عندما يتوفر الجهاز الآخر", !r.ok); done && done();
}
function bindSync(main, info) {
  $("#qrshow", main).onclick = guard(async () => {
    const r = await api("sync/pairing"), svg = await qrSvg(r.code);
    modal("رمز الربط", `<p class="small mute">على الجهاز الآخر: الإعدادات ← «مسح رمز من جهاز آخر». هذا الرمز سرّي: من يملكه يستطيع الانضمام لبياناتك، لا تصوّره ولا ترسله لغيرك.</p>
      ${svg || '<div class="card small">تعذّر رسم QR على هذا الجهاز؛ استخدم الرمز النصي بالأسفل.</div>'}
      ${r.hosts.length ? "" : '<p class="small mute">لم يُكتشف عنوان شبكة محلية. المزامنة ستعتمد على الخادم الوسيط إن حددته.</p>'}
      <div class="field"><label class="f">الرمز النصي (بديل عن QR)</label><textarea id="code" readonly rows="3" style="direction:ltr;font-size:11px">${esc(r.code)}</textarea></div>
      <button class="sec" id="cc" style="width:100%">نسخ الرمز</button>`, { onMount: (b) => { $("#cc", b).onclick = () => { try { navigator.clipboard.writeText(r.code); toast("تم النسخ"); } catch { $("#code", b).select(); } }; } });
  });
  $("#syncnow", main).onclick = guard(async () => {
    const r = await api("sync/now", { method: "POST" });
    if (r.nothing) throw new Error("لا يوجد جهاز مرتبط بعد. اربط جهازاً بالـ QR أولاً.");
    toast(r.ok ? "تمت المزامنة ✓" : "تعذّر الوصول للجهاز الآخر (" + ((r.results[0] || {}).error || "") + ")", !r.ok); go("settings");
  });
  const rt = $("#relaytest", main); if (rt) rt.onclick = guard(async () => { try { const r = await fetch(info.relayUrl.replace(/\/+$/, "") + "/"); const j = await r.json(); toast(j.service === "agri-relay" ? "الخادم يعمل ✓" : "العنوان يعمل لكنه ليس خادم المزامنة", j.service !== "agri-relay"); } catch (e) { toast("تعذّر الوصول للخادم: " + e.message, true); } });
  $("#relaysave", main).onclick = guard(async () => { await api("sync/relay", { method: "POST", body: { url: $("#relay", main).value } }); toast("تم الحفظ"); });
  $$("[data-rmremote]", main).forEach(b => b.onclick = guard(async () => { await api("sync/remote/remove", { method: "POST", body: { url: b.dataset.rmremote } }); go("settings"); }));
  $("#qrscan", main).onclick = () => {
    let stream = null, stop = false;
    const m = modal("مسح رمز الربط", `<video id="vid" playsinline muted style="width:100%;border-radius:10px;background:#000;max-height:50vh"></video><p class="small mute" id="scst">وجّه الكاميرا نحو رمز QR المعروض على الجهاز الآخر…</p>
      <div class="field"><label class="f">أو الصق الرمز النصي هنا</label><textarea id="pc" rows="2" style="direction:ltr"></textarea></div><button id="pj" style="width:100%">ربط بالرمز</button>`, {
      onClose: () => { stop = true; if (stream) stream.getTracks().forEach(t => t.stop()); },
      onMount: async (b, close) => {
        $("#pj", b).onclick = guard(async () => { const c = $("#pc", b).value.trim(); if (!c) return; close(); await joinWithCode(c, () => go("settings")); });
        try {
          await loadLib("lib/jsQR.js"); if (typeof jsQR === "undefined") throw new Error("no jsQR");
          stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
          const v = $("#vid", b); v.srcObject = stream; await v.play(); const cv = document.createElement("canvas"), cx = cv.getContext("2d", { willReadFrequently: true });
          const tick = async () => {
            if (stop) return;
            if (v.videoWidth) { cv.width = v.videoWidth; cv.height = v.videoHeight; cx.drawImage(v, 0, 0); const r = jsQR(cx.getImageData(0, 0, cv.width, cv.height).data, cv.width, cv.height); if (r && /^AGRI1:/i.test(r.data)) { stop = true; close(); try { await joinWithCode(r.data, () => go("settings")); } catch (e) { toast(e.message, true); } return; } }
            requestAnimationFrame(tick);
          }; tick();
        } catch (e) { const st = $("#scst", b); if (st) st.textContent = "تعذّر تشغيل الكاميرا (تحقق من إذن الكاميرا). يمكنك لصق الرمز النصي بدلاً من ذلك."; }
      }
    });
  };
}
